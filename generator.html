<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防災X投稿ジェネレーター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI','Noto Sans JP',Hiragino Sans,sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;font-size:14px;line-height:1.5;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
.title-block h1{font-size:19px;font-weight:600;margin-bottom:3px;}
.title-block p{font-size:12px;color:#666;}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.api-row{display:flex;align-items:center;gap:6px;}
.api-row label{font-size:12px;color:#666;white-space:nowrap;}
.api-row input{width:220px;font-size:12px;padding:6px 10px;border:1px solid #ddd;border-radius:8px;outline:none;background:#fff;}
.api-row input:focus{border-color:#378ADD;}
.reset-btn{font-size:11px;padding:5px 12px;border-radius:20px;background:#fff3f3;border:1px solid #f7c1c1;color:#a32d2d;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid #e8e8e5;border-radius:12px;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e8e8e5;background:#fafaf8;}
.card-head-left{display:flex;align-items:center;gap:8px;}
.card-label{font-size:11px;font-weight:600;color:#555;letter-spacing:.04em;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-red{background:#E24B4A;}.dot-amber{background:#EF9F27;}.dot-blue{background:#378ADD;}
.card-body{padding:12px 14px;}
.card-btn{font-size:11px;padding:4px 10px;border-radius:8px;background:#fafaf8;border:1px solid #ddd;color:#555;}
.card-btn:hover{border-color:#aaa;}
.list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
.list::-webkit-scrollbar{width:3px;}
.list::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px;}
.item{padding:9px 12px;border:1.5px solid #e8e8e5;border-radius:8px;cursor:pointer;transition:all .15s;position:relative;background:#fff;}
.item:hover{border-color:#aaa;background:#fafaf8;}
.item.sel{border-color:#378ADD;background:#EBF4FC;}
.item.sel::after{content:"✓";position:absolute;top:8px;right:10px;font-size:11px;color:#378ADD;font-weight:700;}
.item-type{font-size:10px;color:#999;margin-bottom:2px;letter-spacing:.06em;}
.item-name{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:2px;}
.item-meta{font-size:11px;color:#777;}
.mag{font-size:17px;font-weight:700;margin-bottom:2px;}
.mag-hi{color:#E24B4A;}.mag-md{color:#EF9F27;}.mag-lo{color:#378ADD;}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.badge{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-r{background:#FCEBEB;color:#A32D2D;border:1px solid #F7C1C1;}
.badge-o{background:#FAEEDA;color:#854F0B;border:1px solid #FAC775;}
.badge-y{background:#f5f5f0;color:#666;border:1px solid #ddd;}
.map-btn{font-size:10px;padding:2px 8px;border-radius:10px;background:#EBF4FC;border:1px solid #B5D4F4;color:#185FA5;margin-top:5px;display:inline-block;}
.del-btn{position:absolute;top:8px;right:10px;font-size:11px;color:#bbb;background:none;border:none;padding:0;line-height:1;}
.del-btn:hover{color:#E24B4A;}
.empty-state{text-align:center;padding:28px 16px;font-size:12px;color:#aaa;}
.warn-input-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.warn-input-row input{flex:1;min-width:80px;font-size:12px;padding:6px 10px;border:1px solid #ddd;border-radius:8px;outline:none;font-family:inherit;}
.warn-input-row input:focus{border-color:#378ADD;}
.warn-input-row select{font-size:11px;padding:6px 6px;border:1px solid #ddd;border-radius:8px;outline:none;background:#fff;font-family:inherit;max-width:180px;}
.add-btn{font-size:12px;padding:6px 12px;border-radius:8px;background:#EBF4FC;border:1px solid #B5D4F4;color:#185FA5;white-space:nowrap;}
.illust-section{margin-top:10px;border-top:1px solid #f0f0ec;padding-top:8px;}
.illust-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sep-label{font-size:10px;color:#999;letter-spacing:.06em;}
.illust-clear-btn{font-size:10px;padding:2px 8px;border-radius:10px;background:#fafaf8;border:1px solid #ddd;color:#999;}
.illust-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.illust-item{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 6px;border:1.5px solid #e8e8e5;border-radius:8px;cursor:pointer;background:#fafaf8;font-size:18px;min-width:46px;transition:all .15s;}
.illust-item span{font-size:9px;color:#777;}
.illust-item:hover{border-color:#aaa;}
.illust-item.on{border-color:#378ADD;background:#EBF4FC;}
.illust-item.on span{color:#185FA5;}
.upload-label{font-size:11px;color:#555;background:#fafaf8;border:1px solid #ddd;border-radius:8px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
.upload-label:hover{border-color:#aaa;}
.out-card{background:#fff;border:1px solid #e8e8e5;border-radius:12px;overflow:hidden;margin-bottom:12px;}
.out-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e8e8e5;background:#fafaf8;}
.sel-count{font-size:11px;color:#378ADD;font-weight:600;}
.options-wrap{padding:12px 14px;border-bottom:1px solid #e8e8e5;}
.options-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.opt-btn{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:500;background:#fafaf8;border:1px solid #e8e8e5;color:#555;}
.opt-btn:hover{border-color:#aaa;color:#1a1a1a;}
.opt-btn.on{background:#EBF4FC;border-color:#378ADD;color:#185FA5;}
.gen-wrap{padding:12px 14px;border-bottom:1px solid #e8e8e5;}
.gen-btn{width:100%;padding:11px;font-size:13px;font-weight:600;border-radius:8px;background:#EBF4FC;border:1px solid #B5D4F4;color:#185FA5;}
.gen-btn:hover:not(:disabled){background:#d4eaf8;}
.gen-btn:disabled{opacity:.4;cursor:not-allowed;}
.tabs{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid #e8e8e5;background:#fafaf8;}
.tab-btn{padding:4px 12px;border-radius:20px;font-size:11px;background:none;border:1px solid transparent;color:#999;}
.tab-btn.on{background:#EBF4FC;border-color:#B5D4F4;color:#185FA5;}
.out-body{padding:14px 16px;min-height:100px;}
.out-text{font-size:14px;line-height:1.8;color:#1a1a1a;white-space:pre-wrap;word-break:break-all;}
.out-placeholder{font-size:12px;color:#aaa;text-align:center;padding:24px;}
.err-msg{font-size:11px;color:#A32D2D;padding:8px 12px;background:#FCEBEB;border-radius:8px;line-height:1.6;border:1px solid #F7C1C1;}
.out-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid #e8e8e5;background:#fafaf8;}
.char-count{font-size:11px;color:#aaa;}
.char-count.over{color:#A32D2D;}
.footer-btns{display:flex;gap:6px;align-items:center;}
.copy-btn{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid #ddd;background:#fafaf8;color:#555;}
.copy-btn.ok{background:#EAF3DE;border-color:#C0DD97;color:#3B6D11;}
.x-btn{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:500;text-decoration:none;border:1px solid #ddd;background:#fafaf8;color:#555;}
.dwa-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;text-decoration:none;background:#000;border:1px solid #000;color:#fff;}
.dwa-btn:hover{background:#222;}
.status-bar{background:#fff;border:1px solid #e8e8e5;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:11px;color:#777;}
.st-dot{width:6px;height:6px;border-radius:50%;background:#63C77A;flex-shrink:0;}
.st-dot.ld{background:#378ADD;animation:pulse .8s ease-in-out infinite;}
.st-dot.er{background:#E24B4A;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.spin{display:inline-block;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.cur{display:inline-block;width:2px;height:1em;background:#378ADD;margin-left:2px;vertical-align:text-bottom;animation:blink .6s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
/* 地図モーダル */
#mapModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;}
#mapModal.on{display:flex;}
#mapBox{background:#fff;border-radius:14px;overflow:hidden;width:92%;max-width:560px;box-shadow:0 8px 32px rgba(0,0,0,.25);}
#mapHead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e8e8e5;background:#fafaf8;}
#mapTitle{font-size:13px;font-weight:600;color:#1a1a1a;}
#mapClose{font-size:20px;color:#aaa;background:none;border:none;line-height:1;padding:0 4px;}
#mapClose:hover{color:#1a1a1a;}
#mapFrame{height:340px;width:100%;border:none;display:block;}
#mapInfo{padding:8px 14px;font-size:11px;color:#666;border-top:1px solid #e8e8e5;background:#fafaf8;}
</style>
</head>
<body>

<!-- 地図モーダル -->
<div id="mapModal" onclick="closeMapIfBg(event)">
  <div id="mapBox">
    <div id="mapHead">
      <span id="mapTitle">震源地マップ</span>
      <button id="mapClose" onclick="closeMap()">✕</button>
    </div>
    <iframe id="mapFrame" allowfullscreen></iframe>
    <div id="mapInfo"></div>
  </div>
</div>

<div class="wrap">
  <!-- ヘッダー -->
  <div class="top">
    <div class="title-block">
      <h1>🛡 防災X投稿ジェネレーター</h1>
      <p>地震・気象警報データをもとにAIが投稿文を生成</p>
    </div>
    <div class="top-right">
      <button class="reset-btn" onclick="resetAll()">🔄 全リセット</button>
      <div class="api-row">
        <label for="apiKey">Anthropic API key</label>
        <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
      </div>
    </div>
  </div>

  <!-- 2カラム：地震・警報 -->
  <div class="grid">
    <!-- 地震カード -->
    <div class="card">
      <div class="card-head">
        <div class="card-head-left"><div class="dot dot-red"></div><span class="card-label">地震情報（P2P地震情報API）</span></div>
        <button class="card-btn" id="qBtn" onclick="fetchQuakes()"><span id="qIco">取得</span></button>
      </div>
      <div class="card-body">
        <div class="list" id="qList"><div class="empty-state">「取得」を押してください</div></div>
      </div>
    </div>

    <!-- 警報カード -->
    <div class="card">
      <div class="card-head">
        <div class="card-head-left"><div class="dot dot-amber"></div><span class="card-label">気象警報・注意報（手動入力）</span></div>
        <button class="add-btn" onclick="addWarning()">＋ 追加</button>
      </div>
      <div class="card-body">
        <div class="warn-input-row">
          <input id="wArea" placeholder="都道府県・地域名" list="areaList">
          <datalist id="areaList">
            <option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option>
            <option>秋田県</option><option>山形県</option><option>福島県</option><option>茨城県</option>
            <option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option>
            <option>東京都</option><option>神奈川県</option><option>新潟県</option><option>富山県</option>
            <option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option>
            <option>岐阜県</option><option>静岡県</option><option>愛知県</option><option>三重県</option>
            <option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option>
            <option>奈良県</option><option>和歌山県</option><option>鳥取県</option><option>島根県</option>
            <option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option>
            <option>香川県</option><option>愛媛県</option><option>高知県</option><option>福岡県</option>
            <option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option>
            <option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option>
          </datalist>
          <select id="wType">
            <optgroup label="警戒レベル5">
              <option value="緊急安全確保 警戒レベル5|r">緊急安全確保 Lv5</option>
            </optgroup>
            <optgroup label="警戒レベル4">
              <option value="避難指示 警戒レベル4|r">避難指示 Lv4</option>
            </optgroup>
            <optgroup label="警戒レベル3">
              <option value="高齢者等避難 警戒レベル3|o">高齢者等避難 Lv3</option>
            </optgroup>
            <optgroup label="警戒レベル2">
              <option value="洪水注意報 警戒レベル2相当|o">洪水注意報 Lv2相当</option>
              <option value="大雨注意報 警戒レベル2相当|o">大雨注意報 Lv2相当</option>
            </optgroup>
            <optgroup label="警戒レベル1">
              <option value="早期注意情報 警戒レベル1|y">早期注意情報 Lv1</option>
            </optgroup>
            <optgroup label="特別警報">
              <option value="大雨特別警報|r">大雨特別警報</option>
              <option value="暴風特別警報|r">暴風特別警報</option>
              <option value="大雪特別警報|r">大雪特別警報</option>
              <option value="高潮特別警報|r">高潮特別警報</option>
              <option value="波浪特別警報|r">波浪特別警報</option>
            </optgroup>
            <optgroup label="警報">
              <option value="暴風警報|r">暴風警報</option>
              <option value="大雨警報|r">大雨警報</option>
              <option value="洪水警報|r">洪水警報</option>
              <option value="大雪警報|r">大雪警報</option>
              <option value="波浪警報|r">波浪警報</option>
              <option value="暴風雪警報|r">暴風雪警報</option>
              <option value="高潮警報|r">高潮警報</option>
            </optgroup>
            <optgroup label="注意報">
              <option value="大雨注意報|o">大雨注意報</option>
              <option value="洪水注意報|o">洪水注意報</option>
              <option value="強風注意報|o">強風注意報</option>
              <option value="大雪注意報|o">大雪注意報</option>
              <option value="波浪注意報|o">波浪注意報</option>
              <option value="高潮注意報|o">高潮注意報</option>
              <option value="雷注意報|y">雷注意報</option>
              <option value="濃霧注意報|y">濃霧注意報</option>
              <option value="乾燥注意報|y">乾燥注意報</option>
              <option value="なだれ注意報|y">なだれ注意報</option>
              <option value="低温注意報|y">低温注意報</option>
            </optgroup>
            <optgroup label="情報・警戒情報">
              <option value="土砂災害警戒情報|r">土砂災害警戒情報</option>
              <option value="土砂災害注意情報|o">土砂災害注意情報</option>
              <option value="記録的短時間大雨情報|r">記録的短時間大雨情報</option>
              <option value="竜巻注意情報|o">竜巻注意情報</option>
              <option value="熱中症警戒アラート|o">熱中症警戒アラート</option>
              <option value="熱中症特別警戒アラート|r">熱中症特別警戒アラート</option>
              <option value="津波注意報|o">津波注意報</option>
              <option value="津波警報|r">津波警報</option>
              <option value="大津波警報|r">大津波警報</option>
            </optgroup>
          </select>
        </div>
        <div class="list" id="wList"><div class="empty-state">「＋ 追加」で警報・注意報を入力</div></div>

        <!-- イラスト -->
        <div class="illust-section">
          <div class="illust-header">
            <span class="sep-label">🎨 イラスト絵文字（複数選択可）</span>
            <button class="illust-clear-btn" onclick="clearIllust()">リセット</button>
          </div>
          <div class="illust-grid">
            <div class="illust-item" data-name="暴風" onclick="togIllust(this)">🌪️<span>暴風</span></div>
            <div class="illust-item" data-name="強風" onclick="togIllust(this)">💨<span>強風</span></div>
            <div class="illust-item" data-name="大雨" onclick="togIllust(this)">🌧️<span>大雨</span></div>
            <div class="illust-item" data-name="洪水" onclick="togIllust(this)">🌊<span>洪水</span></div>
            <div class="illust-item" data-name="土砂" onclick="togIllust(this)">⛰️<span>土砂</span></div>
            <div class="illust-item" data-name="大雪" onclick="togIllust(this)">❄️<span>大雪</span></div>
            <div class="illust-item" data-name="雷" onclick="togIllust(this)">⚡<span>雷</span></div>
            <div class="illust-item" data-name="竜巻" onclick="togIllust(this)">🌀<span>竜巻</span></div>
            <div class="illust-item" data-name="津波" onclick="togIllust(this)">🌊<span>津波</span></div>
            <div class="illust-item" data-name="地震" onclick="togIllust(this)">🏚️<span>地震</span></div>
            <div class="illust-item" data-name="熱中症" onclick="togIllust(this)">🌡️<span>熱中症</span></div>
            <div class="illust-item" data-name="避難" onclick="togIllust(this)">🚨<span>避難</span></div>
            <div class="illust-item" data-name="高潮" onclick="togIllust(this)">🌊<span>高潮</span></div>
            <div class="illust-item" data-name="濃霧" onclick="togIllust(this)">🌫️<span>濃霧</span></div>
            <div class="illust-item" data-name="火災" onclick="togIllust(this)">🔥<span>火災</span></div>
            <div class="illust-item" data-name="注意" onclick="togIllust(this)">⚠️<span>注意</span></div>
          </div>
          <label class="upload-label">
            📎 画像を添付
            <input type="file" id="illustFile" accept="image/*" onchange="handleIllust(this)" style="display:none;">
          </label>
          <span id="illustFileName" style="font-size:11px;color:#777;margin-left:6px;"></span>
          <div id="illustPreview" style="margin-top:6px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 生成エリア -->
  <div class="out-card">
    <div class="out-head">
      <div class="card-head-left"><div class="dot dot-blue"></div><span class="card-label">X 投稿文生成</span></div>
      <span class="sel-count" id="selCnt">0件選択中</span>
    </div>
    <div class="options-wrap">
      <div class="sep-label" style="margin-bottom:5px;">投稿スタイル</div>
      <div class="options-row">
        <button class="opt-btn on" data-tone="official" onclick="setTone(this)">公式速報</button>
        <button class="opt-btn" data-tone="alert" onclick="setTone(this)">緊急警戒</button>
        <button class="opt-btn" data-tone="calm" onclick="setTone(this)">冷静詳細</button>
        <button class="opt-btn" data-tone="advice" onclick="setTone(this)">防災アドバイス</button>
        <button class="opt-btn" data-tone="thread" onclick="setTone(this)">スレッド形式</button>
      </div>
      <div class="sep-label" style="margin-bottom:5px;">言語</div>
      <div class="options-row">
        <button class="opt-btn on" data-lang="ja" onclick="setLang(this)">日本語</button>
        <button class="opt-btn" data-lang="en" onclick="setLang(this)">英語</button>
        <button class="opt-btn" data-lang="both" onclick="setLang(this)">両方</button>
      </div>
    </div>
    <div class="gen-wrap">
      <button class="gen-btn" id="genBtn" onclick="generate()">Claude AI で投稿文を生成</button>
    </div>
    <div id="tabsEl" style="display:none;" class="tabs"></div>
    <div class="out-body" id="outBody">
      <div class="out-placeholder">データを選択して生成ボタンを押してください</div>
    </div>
    <div class="out-footer">
      <div class="char-count" id="charCt">— 文字</div>
      <div class="footer-btns">
        <button class="copy-btn" id="copyBtn" onclick="doCopy()">📋 コピー</button>
        <a class="x-btn" href="#" onclick="openX(event)">𝕏 Xで開く</a>
        <a class="dwa-btn" href="https://x.com/DWAbousai0111" target="_blank" rel="noopener">𝕏 DWAbousai</a>
      </div>
    </div>
  </div>

  <div class="status-bar"><div class="st-dot" id="stDot"></div><span id="stTxt">待機中</span></div>
</div>

<script>
// ============================================================
// 状態管理
// ============================================================
var S = {
  quakes: [],
  warnMap: {},
  warnIdSeq: 0,
  selQ: {},
  selW: {},
  tone: 'official',
  lang: 'ja',
  outs: [],
  tab: 0,
  illusts: [],
  illustFile: null,
  illustDataUrl: null
};

// ============================================================
// ユーティリティ
// ============================================================
function $(id){ return document.getElementById(id); }
function status(msg, type){
  $('stDot').className = 'st-dot' + (type === 'ld' ? ' ld' : type === 'er' ? ' er' : '');
  $('stTxt').textContent = msg;
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pad(n){ return String(n).padStart(2,'0'); }
function s2t(s){
  var m = {10:'1',20:'2',30:'3',40:'4',45:'5弱',50:'5強',55:'6弱',60:'6強',70:'7'};
  return m[s] || (s > 0 ? String(Math.floor(s/10)) : '不明');
}
function lvCls(s){ return s >= 55 ? 'mag-hi' : s >= 40 ? 'mag-md' : 'mag-lo'; }
function updateSelCount(){
  var n = Object.keys(S.selQ).length + Object.keys(S.selW).length;
  $('selCnt').textContent = n + '件選択中';
}

// ============================================================
// 地震取得
// ============================================================
function fetchQuakes(){
  var btn = $('qBtn'), ico = $('qIco');
  btn.disabled = true;
  ico.innerHTML = '<span class="spin">↻</span>';
  status('P2P地震情報API 取得中...', 'ld');

  fetch('https://api.p2pquake.net/v2/jma/quake?limit=30')
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(raw){
      var seen = {};
      var items = [];
      var list = Array.isArray(raw) ? raw : [];
      for(var i = 0; i < list.length; i++){
        var it = list[i];
        if(!it || !it.earthquake || !it.earthquake.hypocenter || !it.earthquake.hypocenter.name) continue;
        var eq = it.earthquake, h = eq.hypocenter;
        var key = h.name + '_' + h.magnitude + '_' + (it.time || '').slice(0,16);
        if(seen[key]) continue;
        seen[key] = true;
        // JSTをそのまま表示（new Dateを使わず文字列パース）
        var timeStr = '--';
        var tm = (it.time || '').match(/(\d{2})\/(\d{2}) (\d{2}):(\d{2})/);
        if(tm) timeStr = tm[1]+'/'+tm[2]+' '+tm[3]+':'+tm[4];
        items.push({
          idx: String(items.length),
          name: h.name || '不明',
          mag: h.magnitude >= 0 ? h.magnitude : null,
          depth: h.depth >= 0 ? h.depth : null,
          lat: h.latitude || null,
          lng: h.longitude || null,
          shindo: eq.maxScale > 0 ? eq.maxScale : 0,
          time: timeStr,
          tsunami: eq.domesticTsunami || 'None'
        });
        if(items.length >= 15) break;
      }
      S.quakes = items;
      renderQ();
      status('地震データ取得完了（' + S.quakes.length + '件）');
    })
    .catch(function(e){
      status('地震取得失敗: ' + e.message, 'er');
      $('qList').innerHTML = '<div class="empty-state">取得できませんでした</div>';
    })
    .finally(function(){
      btn.disabled = false;
      ico.textContent = '取得';
    });
}

function renderQ(){
  var el = $('qList');
  if(!S.quakes.length){ el.innerHTML = '<div class="empty-state">データなし</div>'; return; }
  var html = '';
  for(var i = 0; i < S.quakes.length; i++){
    var q = S.quakes[i];
    var sel = S.selQ[q.idx] ? ' sel' : '';
    var mapBtn = q.lat ? '<button class="map-btn" onclick="openMap(\''+q.idx+'\',event)">🗺 地図</button>' : '';
    html += '<div class="item'+sel+'" id="qq'+q.idx+'" onclick="togQ(\''+q.idx+'\')">';
    html += '<div class="item-type">EARTHQUAKE</div>';
    html += '<div class="mag '+lvCls(q.shindo)+'">M'+(q.mag!=null?q.mag.toFixed(1):'?')+'</div>';
    html += '<div class="item-name">'+esc(q.name)+'</div>';
    html += '<div class="item-meta">'+esc(q.time)+' / 深さ'+(q.depth!=null?q.depth+'km':'不明')+' / 最大震度'+s2t(q.shindo)+(q.tsunami!=='None'?' / 🌊津波':'')+'</div>';
    html += mapBtn;
    html += '</div>';
  }
  el.innerHTML = html;
}

function togQ(idx){
  if(S.selQ[idx]){ delete S.selQ[idx]; }
  else { S.selQ[idx] = true; }
  var el = $('qq'+idx);
  if(el) el.className = 'item' + (S.selQ[idx] ? ' sel' : '');
  updateSelCount();
}

// ============================================================
// 警報
// ============================================================
function addWarning(){
  var area = $('wArea').value.trim();
  if(!area){ status('地域名を入力してください', 'er'); return; }
  var parts = $('wType').value.split('|');
  var kind = parts[0], sev = parts[1] || 'y';
  S.warnIdSeq++;
  var id = 'w' + S.warnIdSeq;
  S.warnMap[id] = { id: id, area: area, kind: kind, sev: sev };
  $('wArea').value = '';
  renderW();
  status('追加: ' + area + ' ' + kind);
}

function delWarning(id, event){
  event.stopPropagation();
  delete S.warnMap[id];
  delete S.selW[id];
  renderW();
  updateSelCount();
}

function togW(id){
  if(S.selW[id]){ delete S.selW[id]; }
  else { S.selW[id] = true; }
  var el = $(id);
  if(el) el.className = 'item' + (S.selW[id] ? ' sel' : '');
  updateSelCount();
}

function renderW(){
  var el = $('wList');
  var keys = Object.keys(S.warnMap);
  if(!keys.length){ el.innerHTML = '<div class="empty-state">「＋ 追加」で警報・注意報を入力</div>'; return; }
  var html = '';
  for(var i = 0; i < keys.length; i++){
    var w = S.warnMap[keys[i]];
    var sel = S.selW[w.id] ? ' sel' : '';
    var typeLabel = w.sev === 'r' ? 'WARNING 警報' : 'ADVISORY 注意報';
    html += '<div class="item'+sel+'" id="'+w.id+'" onclick="togW(\''+w.id+'\')">';
    html += '<button class="del-btn" onclick="delWarning(\''+w.id+'\',event)">✕</button>';
    html += '<div class="item-type">'+typeLabel+'</div>';
    html += '<div class="item-name">'+esc(w.area)+'</div>';
    html += '<div class="badges"><span class="badge badge-'+w.sev+'">'+esc(w.kind)+'</span></div>';
    html += '</div>';
  }
  el.innerHTML = html;
}

// ============================================================
// リセット
// ============================================================
function resetAll(){
  S.quakes = [];
  S.warnMap = {};
  S.selQ = {};
  S.selW = {};
  S.illusts = [];
  S.illustFile = null;
  S.illustDataUrl = null;
  $('qList').innerHTML = '<div class="empty-state">「取得」を押してください</div>';
  $('wList').innerHTML = '<div class="empty-state">「＋ 追加」で警報・注意報を入力</div>';
  $('wArea').value = '';
  $('outBody').innerHTML = '<div class="out-placeholder">データを選択して生成ボタンを押してください</div>';
  $('charCt').textContent = '— 文字';
  $('tabsEl').style.display = 'none';
  var items = document.querySelectorAll('.illust-item');
  for(var i=0;i<items.length;i++) items[i].classList.remove('on');
  var fn = $('illustFileName'); if(fn) fn.textContent = '';
  var fi = $('illustFile'); if(fi) fi.value = '';
  var pv = $('illustPreview'); if(pv) pv.innerHTML = '';
  S.outs = []; S.tab = 0;
  updateSelCount();
  status('リセットしました');
}

// ============================================================
// イラスト
// ============================================================
function togIllust(el){
  var name = el.dataset.name;
  var idx = S.illusts.indexOf(name);
  if(idx >= 0){ S.illusts.splice(idx,1); el.classList.remove('on'); }
  else { S.illusts.push(name); el.classList.add('on'); }
}

function handleIllust(input){
  if(!input.files || !input.files[0]) return;
  var file = input.files[0];
  S.illustFile = file;
  var fn = $('illustFileName');
  if(fn) fn.textContent = file.name + ' (' + (file.size/1024).toFixed(0) + 'KB)';
  var reader = new FileReader();
  reader.onload = function(ev){
    S.illustDataUrl = ev.target.result;
    var pv = $('illustPreview');
    if(pv) pv.innerHTML = '<div style="position:relative;display:inline-block;"><img src="'+ev.target.result+'" style="max-width:100%;max-height:130px;border-radius:8px;border:1px solid #e8e8e5;margin-top:4px;display:block;"><button onclick="removeIllustFile()" style="position:absolute;top:4px;right:4px;font-size:10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:4px;cursor:pointer;padding:1px 5px;">✕</button></div>';
    status('画像を添付: ' + file.name);
  };
  reader.onerror = function(){ status('画像の読み込みに失敗', 'er'); };
  reader.readAsDataURL(file);
}

function removeIllustFile(){
  S.illustFile = null; S.illustDataUrl = null;
  var fn = $('illustFileName'); if(fn) fn.textContent = '';
  var fi = $('illustFile'); if(fi) fi.value = '';
  var pv = $('illustPreview'); if(pv) pv.innerHTML = '';
  status('画像を削除しました');
}

function clearIllust(){
  S.illusts = [];
  S.illustFile = null; S.illustDataUrl = null;
  var items = document.querySelectorAll('.illust-item');
  for(var i=0;i<items.length;i++) items[i].classList.remove('on');
  var fn = $('illustFileName'); if(fn) fn.textContent = '';
  var fi = $('illustFile'); if(fi) fi.value = '';
  var pv = $('illustPreview'); if(pv) pv.innerHTML = '';
  status('イラストをリセット');
}

// ============================================================
// スタイル・言語
// ============================================================
function setTone(b){
  var btns = document.querySelectorAll('[data-tone]');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
  b.classList.add('on'); S.tone = b.dataset.tone;
}
function setLang(b){
  var btns = document.querySelectorAll('[data-lang]');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
  b.classList.add('on'); S.lang = b.dataset.lang;
}

// ============================================================
// AI生成
// ============================================================
var TONE = {
  official: '防災機関の公式アカウントが発信する正確で信頼性の高い速報スタイル。#地震速報 #防災 などのハッシュタグを付ける。',
  alert:    '緊急感・警戒感を前面に出した強調スタイル。絵文字を効果的に使用し、読み手に即座の行動を促す。',
  calm:     '冷静で詳細な情報提供スタイル。数値・状況を正確に伝え、専門的かつ読みやすく。',
  advice:   '防災アドバイス・行動指針を重視。具体的な行動提案を必ず含む。',
  thread:   'Xのスレッド形式で3投稿に分割。①速報概要 ②詳細情報 ③行動指針+ハッシュタグ。各投稿を空行2つで区切る。'
};

function generate(){
  var qKeys = Object.keys(S.selQ);
  var wKeys = Object.keys(S.selW);
  if(qKeys.length + wKeys.length === 0){
    status('データを1件以上選択してください', 'er'); return;
  }
  var key = $('apiKey').value.trim();
  if(!key){ status('APIキーを入力してください', 'er'); return; }

  var lines = [];
  for(var i=0;i<qKeys.length;i++){
    var q = null;
    for(var j=0;j<S.quakes.length;j++){ if(S.quakes[j].idx===qKeys[i]){ q=S.quakes[j]; break; } }
    if(!q) continue;
    lines.push('【地震情報】震源地=' + q.name
      + ' M=' + (q.mag!=null?q.mag.toFixed(1):'不明')
      + ' 深さ=' + (q.depth!=null?q.depth+'km':'不明')
      + ' 最大震度=' + s2t(q.shindo)
      + ' 時刻=' + q.time
      + (q.tsunami!=='None'?' 津波情報あり':''));
  }
  for(var i=0;i<wKeys.length;i++){
    var w = S.warnMap[wKeys[i]];
    if(!w) continue;
    lines.push('【気象警報】地域=' + w.area + ' 種別=' + w.kind);
  }
  if(S.illusts.length > 0){
    lines.push('【絵文字指定】投稿文に含める絵文字: ' + S.illusts.join(' '));
  }

  var isThread = S.tone === 'thread';
  var langP = S.lang==='ja' ? '日本語のみ' : S.lang==='en' ? '英語のみ(280字以内)' : '日本語と英語の両方(---で区切る)';

  var sys = 'あなたはX（旧Twitter）で防災情報を発信する専門アカウントの担当者です。\n'
    + 'スタイル: ' + TONE[S.tone] + '\n'
    + '言語: ' + langP + '\n'
    + '文字数: ' + (isThread?'各投稿140字以内':'140字以内') + '\n'
    + '【厳守】\n'
    + '・【気象警報】の「地域=〇〇」の地名を投稿文の先頭に【〇〇】の形式で必ず記載する\n'
    + '・【地震情報】の「震源地=〇〇」の地名を投稿文に必ず記載する\n'
    + '・免責文・注釈・コメントは一切付けない\n'
    + '・投稿文のみ出力する';

  var userMsg = '以下の防災データでX投稿文を作成してください。\n\n'
    + lines.join('\n');

  var gb = $('genBtn');
  gb.disabled = true; gb.textContent = '生成中...';
  status('Claude AI が生成中...', 'ld');
  $('tabsEl').style.display = 'none';
  $('outBody').innerHTML = '<div class="out-text"><span class="cur"></span></div>';
  $('charCt').textContent = '— 文字';

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 800,
      stream: true,
      system: sys,
      messages: [{ role: 'user', content: userMsg }]
    })
  })
  .then(function(res){
    if(!res.ok){
      return res.json().then(function(e){ throw new Error(e.error ? e.error.message : 'API Error '+res.status); });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = '', full = '';
    function read(){
      return reader.read().then(function(x){
        if(x.done){
          var outs;
          if(isThread){
            outs = full.split(/\n{2,}/).map(function(s){ return s.trim(); }).filter(Boolean);
          } else {
            outs = [full.trim()];
          }
          S.outs = outs; S.tab = 0;
          buildTabs(); showTab(0);
          status('生成完了');
          gb.disabled = false; gb.textContent = 'Claude AI で投稿文を生成';
          return;
        }
        buf += dec.decode(x.value, {stream:true});
        var lines2 = buf.split('\n'); buf = lines2.pop();
        for(var i=0;i<lines2.length;i++){
          var line = lines2[i];
          if(line.indexOf('data:') !== 0) continue;
          var raw = line.slice(5).trim();
          if(raw === '[DONE]') continue;
          try{
            var p = JSON.parse(raw);
            if(p.type==='content_block_delta' && p.delta && p.delta.type==='text_delta' && p.delta.text){
              full += p.delta.text;
              var el = document.querySelector('#outBody .out-text');
              if(el) el.innerHTML = esc(full) + '<span class="cur"></span>';
            }
          }catch(e2){}
        }
        return read();
      });
    }
    return read();
  })
  .catch(function(e){
    $('outBody').innerHTML = '<div class="err-msg">' + esc(e.message) + '</div>';
    status('生成エラー: ' + e.message, 'er');
    gb.disabled = false; gb.textContent = 'Claude AI で投稿文を生成';
  });
}

// ============================================================
// タブ・コピー・X投稿
// ============================================================
function buildTabs(){
  var el = $('tabsEl');
  if(S.outs.length <= 1){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  var html = '';
  for(var i=0;i<S.outs.length;i++){
    html += '<button class="tab-btn'+(i===0?' on':'')+'" data-i="'+i+'" onclick="clickTab(this)">投稿'+(i+1)+'</button>';
  }
  el.innerHTML = html;
}
function clickTab(b){
  var btns = document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
  b.classList.add('on'); S.tab = parseInt(b.dataset.i); showTab(S.tab);
}
function showTab(i){
  var t = S.outs[i] || '';
  $('outBody').innerHTML = '<div class="out-text">' + esc(t) + '</div>';
  var ct = $('charCt');
  ct.textContent = t.length + ' 文字';
  ct.className = 'char-count' + (t.length > 140 ? ' over' : '');
}
function doCopy(){
  var t = S.outs[S.tab] || ''; if(!t) return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(function(){
      var b = $('copyBtn'); b.textContent = '✓ コピー済み'; b.classList.add('ok');
      setTimeout(function(){ b.textContent = '📋 コピー'; b.classList.remove('ok'); }, 2000);
    });
  } else {
    var ta = document.createElement('textarea'); ta.value = t;
    ta.style.cssText = 'position:fixed;opacity:0;'; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    status('コピーしました');
  }
}
function openX(e){
  e.preventDefault();
  var t = S.outs[S.tab] || ''; if(!t){ status('投稿文がありません','er'); return; }
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(t), '_blank');
}

// ============================================================
// 地図
// ============================================================
function openMap(idx, event){
  event.stopPropagation();
  var q = null;
  for(var i=0;i<S.quakes.length;i++){ if(S.quakes[i].idx===idx){ q=S.quakes[i]; break; } }
  if(!q || !q.lat || !q.lng){ status('この地震の座標データがありません','er'); return; }
  $('mapTitle').textContent = '震源地: ' + q.name + '  M' + (q.mag!=null?q.mag.toFixed(1):'?');
  $('mapInfo').textContent = q.time + ' ／ 深さ' + (q.depth!=null?q.depth+'km':'不明') + ' ／ 最大震度' + s2t(q.shindo);
  var lat = q.lat, lng = q.lng;
  var url = 'https://www.openstreetmap.org/export/embed.html?bbox='
    + (lng-1.5) + ',' + (lat-1.5) + ',' + (lng+1.5) + ',' + (lat+1.5)
    + '&layer=mapnik&marker=' + lat + ',' + lng;
  $('mapFrame').src = url;
  $('mapModal').classList.add('on');
}
function closeMap(){
  $('mapModal').classList.remove('on');
  $('mapFrame').src = '';
}
function closeMapIfBg(e){
  if(e.target === $('mapModal')) closeMap();
}

// Enterで追加
document.addEventListener('DOMContentLoaded', function(){
  var wa = $('wArea');
  if(wa) wa.addEventListener('keydown', function(e){ if(e.key==='Enter') addWarning(); });
});
</script>
</body>
</html>
