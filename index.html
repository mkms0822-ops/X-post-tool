<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防災X投稿ジェネレーター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI','Noto Sans JP',Hiragino Sans,sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;font-size:14px;line-height:1.5;}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.title-block h1{font-size:20px;font-weight:600;color:#1a1a1a;margin-bottom:3px;}
.title-block p{font-size:13px;color:#666;}
.api-row{display:flex;align-items:center;gap:8px;}
.api-row label{font-size:12px;color:#666;white-space:nowrap;}
.api-row input{width:240px;font-size:12px;padding:7px 11px;border:1px solid #ddd;border-radius:8px;outline:none;background:#fff;transition:border-color .2s;}
.api-row input:focus{border-color:#378ADD;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid #e8e8e5;border-radius:12px;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e8e8e5;background:#fafaf8;}
.card-head-left{display:flex;align-items:center;gap:8px;}
.card-label{font-size:11px;font-weight:600;color:#555;letter-spacing:0.04em;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-red{background:#E24B4A;}.dot-amber{background:#EF9F27;}.dot-blue{background:#378ADD;}
.card-body{padding:12px 14px;}
.list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;}
.list::-webkit-scrollbar{width:3px;}
.list::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px;}
.item{padding:10px 12px;border:1px solid #e8e8e5;border-radius:8px;cursor:pointer;transition:all .15s;position:relative;background:#fff;}
.item:hover{border-color:#aaa;background:#fafaf8;}
.item.sel{border-color:#378ADD;background:#EBF4FC;}
.item.sel::after{content:"✓";position:absolute;top:8px;right:10px;font-size:11px;color:#378ADD;font-weight:700;}
.item-type{font-size:10px;color:#999;margin-bottom:3px;letter-spacing:0.06em;}
.item-name{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:3px;}
.item-meta{font-size:11px;color:#777;}
.mag{font-size:18px;font-weight:700;margin-bottom:2px;}
.mag-hi{color:#E24B4A;}.mag-md{color:#EF9F27;}.mag-lo{color:#378ADD;}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-r{background:#FCEBEB;color:#A32D2D;border:1px solid #F7C1C1;}
.badge-o{background:#FAEEDA;color:#854F0B;border:1px solid #FAC775;}
.badge-y{background:#f5f5f0;color:#666;border:1px solid #ddd;}
.empty-state{text-align:center;padding:32px 16px;font-size:12px;color:#aaa;}
.err-msg{font-size:11px;color:#A32D2D;padding:8px 12px;background:#FCEBEB;border-radius:8px;margin-top:8px;line-height:1.6;border:1px solid #F7C1C1;}
.demo-btn{margin-top:8px;width:100%;padding:7px;font-size:11px;border-radius:8px;background:#fafaf8;border:1px solid #ddd;color:#555;cursor:pointer;}
.out-card{background:#fff;border:1px solid #e8e8e5;border-radius:12px;overflow:hidden;margin-bottom:12px;}
.out-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e8e8e5;background:#fafaf8;}
.sel-count{font-size:11px;color:#378ADD;font-weight:600;}
.options-wrap{padding:12px 14px;border-bottom:1px solid #e8e8e5;}
.sep-label{font-size:11px;color:#999;margin-bottom:6px;letter-spacing:0.06em;}
.options-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.opt-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;background:#fafaf8;border:1px solid #e8e8e5;color:#555;cursor:pointer;transition:all .15s;}
.opt-btn.on{background:#EBF4FC;border-color:#378ADD;color:#185FA5;}
.gen-wrap{padding:12px 14px;border-bottom:1px solid #e8e8e5;}
.gen-btn-main{width:100%;padding:11px;font-size:13px;font-weight:600;border-radius:8px;background:#EBF4FC;border:1px solid #B5D4F4;color:#185FA5;cursor:pointer;}
.gen-btn-main:disabled{opacity:.4;cursor:not-allowed;}
.tabs{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid #e8e8e5;background:#fafaf8;}
.tab-btn{padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;background:none;border:1px solid transparent;color:#999;}
.tab-btn.on{background:#EBF4FC;border-color:#B5D4F4;color:#185FA5;}
.out-body{padding:14px 16px;min-height:100px;}
.out-text{font-size:14px;line-height:1.8;color:#1a1a1a;white-space:pre-wrap;word-break:break-all;}
.out-placeholder{font-size:12px;color:#aaa;text-align:center;padding:24px;}
.out-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid #e8e8e5;background:#fafaf8;}
.char-count{font-size:11px;color:#aaa;}
.char-count.over{color:#A32D2D;}
.footer-btns{display:flex;gap:8px;}
.copy-btn,.x-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px;border:1px solid #ddd;background:#fafaf8;color:#555;}
.copy-btn.ok{background:#EAF3DE;border-color:#C0DD97;color:#3B6D11;}
.status-bar{background:#fff;border:1px solid #e8e8e5;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:11px;color:#777;}
.st-dot{width:6px;height:6px;border-radius:50%;background:#63C77A;flex-shrink:0;}
.st-dot.ld{background:#378ADD;animation:pulse .8s ease-in-out infinite;}
.st-dot.er{background:#E24B4A;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.spin{display:inline-block;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.cur{display:inline-block;width:2px;height:1em;background:#378ADD;margin-left:2px;vertical-align:text-bottom;animation:blink .6s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
button{font-family:inherit;padding:5px 12px;border-radius:8px;background:#fafaf8;border:1px solid #ddd;color:#555;cursor:pointer;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title-block">
      <h1>🛡 防災X投稿ジェネレーター</h1>
      <p>地震・気象警報データをもとにAIが投稿文を生成</p>
    </div>
    <div class="api-row">
      <label for="apiKey">Anthropic API key</label>
      <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
    </div>
  </div>
  <div class="grid">
    <div class="card">
      <div class="card-head">
        <div class="card-head-left"><div class="dot dot-red"></div><span class="card-label">地震情報（P2P地震情報API）</span></div>
        <button id="qBtn" onclick="fetchQuakes()"><span id="qIco">取得</span></button>
      </div>
      <div class="card-body">
        <div class="list" id="qList"><div class="empty-state">「取得」を押してください</div></div>
        <div id="qErr"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-head-left"><div class="dot dot-amber"></div><span class="card-label">気象警報・注意報（気象庁API）</span></div>
        <button id="wBtn" onclick="fetchWarnings()"><span id="wIco">取得</span></button>
      </div>
      <div class="card-body">
        <div class="list" id="wList"><div class="empty-state">「取得」を押してください</div></div>
        <div id="wErr"></div>
      </div>
    </div>
  </div>
  <div class="out-card">
    <div class="out-head">
      <div class="card-head-left"><div class="dot dot-blue"></div><span class="card-label">X 投稿文生成</span></div>
      <span class="sel-count" id="selCnt">0件選択中</span>
    </div>
    <div class="options-wrap">
      <div class="sep-label">投稿スタイル</div>
      <div class="options-row">
        <button class="opt-btn on" data-tone="official" onclick="setTone(this)">公式速報</button>
        <button class="opt-btn" data-tone="alert" onclick="setTone(this)">緊急警戒</button>
        <button class="opt-btn" data-tone="calm" onclick="setTone(this)">冷静詳細</button>
        <button class="opt-btn" data-tone="advice" onclick="setTone(this)">防災アドバイス</button>
        <button class="opt-btn" data-tone="thread" onclick="setTone(this)">スレッド形式</button>
      </div>
      <div class="sep-label">言語</div>
      <div class="options-row">
        <button class="opt-btn on" data-lang="ja" onclick="setLang(this)">日本語</button>
        <button class="opt-btn" data-lang="en" onclick="setLang(this)">英語</button>
        <button class="opt-btn" data-lang="both" onclick="setLang(this)">両方</button>
      </div>
    </div>
    <div class="gen-wrap">
      <button class="gen-btn-main" id="genBtn" onclick="generate()">Claude AI で投稿文を生成</button>
    </div>
    <div id="tabsEl" style="display:none;" class="tabs"></div>
    <div class="out-body" id="outBody"><div class="out-placeholder">データを選択して生成ボタンを押してください</div></div>
    <div class="out-footer">
      <div class="char-count" id="charCt">— 文字</div>
      <div class="footer-btns">
        <button class="copy-btn" id="copyBtn" onclick="doCopy()">📋 コピー</button>
        <a class="x-btn" href="#" onclick="openX(event)">𝕏 X で開く</a>
      </div>
    </div>
  </div>
  <div class="status-bar"><div class="st-dot" id="stDot"></div><span id="stTxt">待機中</span></div>
</div>
<script>
const S={quakes:[],warns:[],sel:new Set(),tone:'official',lang:'ja',outs:[],tab:0};
const JMA_URL='https://www.jma.go.jp/bosai/warning/data/warning/all.json';
// プロキシ候補（複数のサービスをフォールバック）
const PROXIES=[
  // allorigins: 最も安定
  url=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  // thingproxy
  url=>`https://thingproxy.freeboard.io/fetch/${url}`,
  // corsproxy.io（Referer付き）
  url=>`https://corsproxy.io/?${encodeURIComponent(url)}`,
  // htmldriven
  url=>`https://cors.bridged.cc/${url}`,
];
function status(msg,type){document.getElementById('stDot').className='st-dot'+(type==='ld'?' ld':type==='er'?' er':'');document.getElementById('stTxt').textContent=msg;}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pad(n){return String(n).padStart(2,'0');}
function s2t(s){return({10:'1',20:'2',30:'3',40:'4',45:'5弱',50:'5強',55:'6弱',60:'6強',70:'7'})[s]||(s>0?''+Math.floor(s/10):'不明');}
function lvCls(s){return s>=55?'mag-hi':s>=40?'mag-md':'mag-lo';}
async function safeFetch(url,ms=10000,opts={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,...opts});clearTimeout(t);return r;}catch(e){clearTimeout(t);if(e.name==='AbortError')throw new Error('タイムアウト');throw e;}}
async function fetchViaProxy(originalUrl){
  // 直接アクセスを試みる
  try{const r=await safeFetch(originalUrl,5000);if(r.ok)return await r.json();}catch(_){}
  // プロキシを順番に試す
  for(let i=0;i<PROXIES.length;i++){
    const proxyUrl=PROXIES[i](originalUrl);
    try{
      status(`プロキシ${i+1}/${PROXIES.length} 試行中...`,'ld');
      const r=await safeFetch(proxyUrl,8000);
      if(r.ok){
        const text=await r.text();
        // HTMLが返ってきた場合はスキップ
        if(text.trim().startsWith('<'))continue;
        return JSON.parse(text);
      }
    }catch(_){continue;}
  }
  throw new Error('CORS制限により取得できませんでした。「デモデータ」をご利用ください。');
}
async function fetchQuakes(){
  const btn=document.getElementById('qBtn'),ico=document.getElementById('qIco');
  btn.disabled=true;ico.innerHTML='<span class="spin">↻</span>';document.getElementById('qErr').innerHTML='';status('P2P地震情報API 取得中...','ld');
  try{
    const r=await safeFetch('https://api.p2pquake.net/v2/jma/quake?limit=15');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const raw=await r.json();
    S.quakes=(Array.isArray(raw)?raw:[]).filter(it=>it?.earthquake?.hypocenter?.name).map(it=>{
      const eq=it.earthquake,h=eq.hypocenter;const d=new Date((it.time||'').replace(/\//g,'-').replace(' ','T'));
      return{name:h.name||'不明',mag:h.magnitude>=0?h.magnitude:null,depth:h.depth>=0?h.depth:null,shindo:eq.maxScale>0?eq.maxScale:0,time:isNaN(d.getTime())?'--':(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes()),tsunami:eq.domesticTsunami||'None'};
    });
    renderQ();status('地震データ取得完了（'+S.quakes.length+'件）');
  }catch(e){status('地震取得失敗: '+e.message,'er');document.getElementById('qList').innerHTML='<div class="empty-state">取得できませんでした</div>';document.getElementById('qErr').innerHTML='<div class="err-msg">'+esc(e.message)+'</div>';}
  finally{btn.disabled=false;ico.textContent='取得';}
}
function renderQ(){
  const el=document.getElementById('qList');
  if(!S.quakes.length){el.innerHTML='<div class="empty-state">データなし</div>';return;}
  el.innerHTML=S.quakes.map((q,i)=>`<div class="item${S.sel.has('q'+i)?' sel':''}" id="q${i}" onclick="tog('q${i}')"><div class="item-type">EARTHQUAKE</div><div class="mag ${lvCls(q.shindo)}">M${q.mag!=null?q.mag.toFixed(1):'?'}</div><div class="item-name">${esc(q.name)}</div><div class="item-meta">${esc(q.time)} / 深さ${q.depth!=null?q.depth+'km':'不明'} / 最大震度${s2t(q.shindo)}${q.tsunami!=='None'?' / 🌊津波情報あり':''}</div></div>`).join('');
}
const WC={'02':'大雨警報','03':'洪水警報','04':'強風警報','05':'波浪警報','06':'暴風雪警報','07':'大雪警報','10':'暴風警報','14':'大雨注意報','15':'洪水注意報','16':'強風注意報','17':'波浪注意報','18':'雷注意報','19':'融雪注意報','20':'濃霧注意報','21':'乾燥注意報','22':'なだれ注意報','23':'低温注意報','24':'霜注意報','25':'着氷注意報','26':'着雪注意報','32':'暴風雪注意報','33':'大雪注意報'};
const WS={'02':'r','03':'r','10':'r','06':'r','07':'r','04':'r','05':'r','14':'o','15':'o','16':'o','17':'o','32':'o','33':'o','18':'y','19':'y','20':'y','21':'y','22':'y','23':'y','24':'y','25':'y','26':'y'};
async function fetchWarnings(){
  const btn=document.getElementById('wBtn'),ico=document.getElementById('wIco');
  btn.disabled=true;ico.innerHTML='<span class="spin">↻</span>';document.getElementById('wErr').innerHTML='';status('気象庁API 取得中...','ld');
  try{
    const data=await fetchViaProxy(JMA_URL);
    const list=[],sv={r:0,o:1,y:2};
    for(const[,area]of Object.entries(data)){if(!area?.warnings)continue;const active=area.warnings.filter(w=>w.status==='発表'||w.status==='継続');if(!active.length)continue;list.push({name:area.areaName||'?',items:active.map(w=>({name:WC[w.code]||'コード'+w.code,sev:WS[w.code]||'y'}))});}
    list.sort((a,b)=>Math.min(...a.items.map(i=>sv[i.sev]??9))-Math.min(...b.items.map(i=>sv[i.sev]??9)));
    S.warns=list.slice(0,50);renderW();status(S.warns.length?'警報・注意報取得完了（'+S.warns.length+'エリア）':'現在、有効な警報・注意報はありません');
  }catch(e){
    status('警報取得失敗: '+e.message,'er');document.getElementById('wList').innerHTML='<div class="empty-state">取得できませんでした</div>';
    document.getElementById('wErr').innerHTML=`<div class="err-msg">${esc(e.message)}</div><button class="demo-btn" onclick="loadDemo()">📋 デモデータで動作確認する</button>`;
  }finally{btn.disabled=false;ico.textContent='取得';}
}
function loadDemo(){
  S.warns=[{name:'東京都',items:[{name:'暴風警報',sev:'r'},{name:'洪水警報',sev:'r'}]},{name:'神奈川県',items:[{name:'波浪警報',sev:'r'},{name:'雷注意報',sev:'y'}]},{name:'埼玉県',items:[{name:'大雨注意報',sev:'o'},{name:'雷注意報',sev:'y'}]},{name:'千葉県',items:[{name:'濃霧注意報',sev:'y'}]}];
  renderW();document.getElementById('wErr').innerHTML='<div class="err-msg" style="background:#FAEEDA;color:#854F0B;border-color:#FAC775;">⚠ デモデータ表示中（実際のデータではありません）</div>';status('デモデータを読み込みました');
}
function renderW(){
  const el=document.getElementById('wList');
  if(!S.warns.length){el.innerHTML='<div class="empty-state">現在、有効な警報・注意報はありません</div>';return;}
  el.innerHTML=S.warns.map((w,i)=>`<div class="item${S.sel.has('w'+i)?' sel':''}" id="w${i}" onclick="tog('w${i}')"><div class="item-type">${w.items.some(x=>x.sev==='r')?'WARNING 警報':'ADVISORY 注意報'}</div><div class="item-name">${esc(w.name)}</div><div class="badges">${w.items.map(it=>`<span class="badge badge-${it.sev}">${esc(it.name)}</span>`).join('')}</div></div>`).join('');
}
function tog(id){S.sel.has(id)?S.sel.delete(id):S.sel.add(id);document.getElementById(id)?.classList.toggle('sel',S.sel.has(id));document.getElementById('selCnt').textContent=S.sel.size+'件選択中';}
function setTone(b){document.querySelectorAll('[data-tone]').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tone=b.dataset.tone;}
function setLang(b){document.querySelectorAll('[data-lang]').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.lang=b.dataset.lang;}
const TONE={official:'防災機関の公式アカウントが発信する正確で信頼性の高い速報スタイル。#地震速報 #防災 などのハッシュタグを付ける。',alert:'緊急感・警戒感を前面に出した強調スタイル。絵文字を効果的に使用し、読み手に即座の行動を促す。',calm:'冷静で詳細な情報提供スタイル。数値・状況を正確に伝え、専門的かつ読みやすく。',advice:'防災アドバイス・行動指針を重視。具体的な行動提案を必ず含む。',thread:'Xのスレッド形式で3投稿に分割。①速報概要 ②詳細情報 ③行動指針+ハッシュタグ。各投稿を空行2つで区切る。'};
async function generate(){
  if(!S.sel.size){status('データを1件以上選択してください','er');return;}
  const key=document.getElementById('apiKey').value.trim();if(!key){status('APIキーを入力してください','er');return;}
  const items=[];
  for(const id of S.sel){if(id.startsWith('q')){const q=S.quakes[+id.slice(1)];if(q)items.push(`【地震】震源:${q.name} M${q.mag!=null?q.mag.toFixed(1):'不明'} 深さ${q.depth!=null?q.depth+'km':'不明'} 最大震度${s2t(q.shindo)} 発生:${q.time}${q.tsunami!=='None'?' 津波情報あり':''}`);}else{const w=S.warns[+id.slice(1)];if(w)items.push(`【気象警報】${w.name}: ${w.items.map(i=>i.name).join('、')}`);}}
  const isThread=S.tone==='thread';
  const langP=S.lang==='ja'?'日本語のみ。':S.lang==='en'?'英語のみ（280字以内）。':'日本語版と英語版を両方。---で区切る。';
  const sys=`あなたは防災情報をXに発信する専門アカウントの担当者です。\nスタイル: ${TONE[S.tone]}\n言語: ${langP}\n文字数: ${isThread?'各投稿140字以内（スレッド番号付き）':'140字以内'}\n注意: 投稿文のみ出力。説明・前置き不要。`;
  const gb=document.getElementById('genBtn');gb.disabled=true;gb.textContent='生成中...';status('Claude AI が生成中...','ld');document.getElementById('tabsEl').style.display='none';document.getElementById('outBody').innerHTML='<div class="out-text"><span class="cur"></span></div>';document.getElementById('charCt').textContent='— 文字';
  let full='';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,stream:true,system:sys,messages:[{role:'user',content:'以下の情報をもとに投稿文を作成してください:\n\n'+items.join('\n')}]})});
    if(!res.ok){let msg='API Error '+res.status;try{const e=await res.json();msg=e?.error?.message||msg;}catch(_){}throw new Error(msg);}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(raw==='[DONE]')continue;try{const p=JSON.parse(raw);if(p.type==='content_block_delta'&&p.delta?.type==='text_delta'&&p.delta.text){full+=p.delta.text;document.querySelector('#outBody .out-text').innerHTML=esc(full)+'<span class="cur"></span>';}}catch(_){}}}
    S.outs=isThread?full.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean):[full.trim()];S.tab=0;buildTabs();showTab(0);status('生成完了');
  }catch(e){document.getElementById('outBody').innerHTML='<div class="err-msg">'+esc(e.message)+'</div>';status('生成エラー: '+e.message,'er');}
  finally{gb.disabled=false;gb.textContent='Claude AI で投稿文を生成';}
}
function buildTabs(){const el=document.getElementById('tabsEl');if(S.outs.length<=1){el.style.display='none';return;}el.style.display='flex';el.innerHTML=S.outs.map((_,i)=>`<button class="tab-btn${i===0?' on':''}" data-i="${i}" onclick="clickTab(this)">投稿${i+1}</button>`).join('');}
function clickTab(b){document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=+b.dataset.i;showTab(S.tab);}
function showTab(i){const t=S.outs[i]||'';document.getElementById('outBody').innerHTML='<div class="out-text">'+esc(t)+'</div>';const ct=document.getElementById('charCt');ct.textContent=t.length+' 文字';ct.className='char-count'+(t.length>140?' over':'');}
function doCopy(){const t=S.outs[S.tab]||'';if(!t)return;navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('copyBtn');b.textContent='✓ コピー済み';b.classList.add('ok');setTimeout(()=>{b.textContent='📋 コピー';b.classList.remove('ok');},2000);}).catch(()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);status('コピーしました');});}
function openX(e){e.preventDefault();const t=S.outs[S.tab]||'';if(!t){status('投稿文がありません','er');return;}window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t),'_blank');}
</script>
