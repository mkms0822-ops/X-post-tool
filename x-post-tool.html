<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防災X投稿ジェネレーター</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Segoe UI','Noto Sans JP',Hiragino Sans,sans-serif;
  background:#04080f; color:#cce0f5;
  min-height:100vh; overflow-x:hidden;
  font-size:14px; line-height:1.5;
}

/* LAYOUT */
header{
  position:sticky; top:0; z-index:100;
  background:rgba(4,8,15,0.97);
  border-bottom:1px solid rgba(0,180,255,0.15);
  padding:0 24px; height:60px;
  display:flex; align-items:center; justify-content:space-between;
}
.logo-text{font-size:15px;font-weight:700;color:#00b4ff;letter-spacing:0.03em;}
.logo-sub{font-size:9px;color:#3d5a78;letter-spacing:0.15em;display:block;margin-top:1px;}
.api-row{display:flex;align-items:center;gap:8px;}
.api-label{font-size:10px;color:#3d5a78;letter-spacing:0.1em;white-space:nowrap;}
.api-input{
  width:240px; padding:6px 11px;
  background:#0a1020; border:1px solid rgba(0,180,255,0.2);
  border-radius:6px; color:#cce0f5; font-size:11px; outline:none;
  transition:border-color .2s;
}
.api-input:focus{border-color:#00b4ff;}
.api-input::placeholder{color:#3d5a78;}

.wrap{
  max-width:1160px; margin:0 auto; padding:24px 20px 80px;
  display:grid; grid-template-columns:1fr 1fr; gap:18px;
}
@media(max-width:800px){.wrap{grid-template-columns:1fr;}}

/* PANEL */
.panel{
  background:#0a1020; border:1px solid rgba(0,180,255,0.13);
  border-radius:12px; overflow:hidden;
}
.panel-head{
  padding:12px 18px; border-bottom:1px solid rgba(0,180,255,0.1);
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(0,180,255,0.03);
}
.panel-title{
  font-size:10px; letter-spacing:0.18em; color:#00b4ff;
  display:flex; align-items:center; gap:7px; font-weight:700;
}
.blink-dot{
  width:6px;height:6px;border-radius:50%;
  animation:bdot 1.8s ease-in-out infinite;
}
@keyframes bdot{0%,100%{opacity:1;}50%{opacity:.2;}}
.panel-body{padding:16px 18px;}

/* BUTTONS */
.fetch-btn{
  display:flex; align-items:center; gap:6px;
  padding:5px 13px; border-radius:16px;
  background:rgba(0,180,255,0.1); border:1px solid rgba(0,180,255,0.28);
  color:#00b4ff; font-size:10px; letter-spacing:0.1em;
  cursor:pointer; transition:all .2s; font-weight:700;
}
.fetch-btn:hover:not(:disabled){background:rgba(0,180,255,0.2);}
.fetch-btn:disabled{opacity:.4;cursor:not-allowed;}
.gen-btn{
  width:100%; padding:12px; border-radius:9px;
  background:rgba(0,130,220,0.15); border:1px solid rgba(0,180,255,0.35);
  color:#00b4ff; font-size:11px; letter-spacing:0.14em; font-weight:700;
  cursor:pointer; transition:all .2s; display:flex;
  align-items:center; justify-content:center; gap:8px;
}
.gen-btn:hover:not(:disabled){background:rgba(0,130,220,0.28);}
.gen-btn:disabled{opacity:.35;cursor:not-allowed;}
.copy-btn,.x-btn{
  display:flex; align-items:center; gap:5px;
  padding:6px 15px; border-radius:16px; font-size:10px;
  letter-spacing:0.1em; cursor:pointer; transition:all .2s; font-weight:700;
}
.copy-btn{background:rgba(0,180,255,0.1);border:1px solid rgba(0,180,255,0.3);color:#00b4ff;}
.copy-btn:hover{background:rgba(0,180,255,0.22);}
.copy-btn.ok{background:rgba(0,232,122,0.1);border-color:rgba(0,232,122,0.35);color:#00e87a;}
.x-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:#e0e8f0;text-decoration:none;}
.x-btn:hover{background:rgba(255,255,255,0.12);}
.tone-btn{
  padding:5px 13px; border-radius:16px;
  background:#0e1628; border:1px solid rgba(0,180,255,0.14);
  color:#3d5a78; font-size:10px; letter-spacing:0.06em;
  cursor:pointer; transition:all .15s; font-weight:700;
}
.tone-btn:hover{border-color:rgba(0,180,255,0.35);color:#cce0f5;}
.tone-btn.on{background:rgba(0,180,255,0.12);border-color:#00b4ff;color:#00b4ff;}

/* DATA LIST */
.data-list{
  display:flex; flex-direction:column; gap:7px;
  max-height:320px; overflow-y:auto;
}
.data-list::-webkit-scrollbar{width:3px;}
.data-list::-webkit-scrollbar-thumb{background:rgba(0,180,255,0.2);border-radius:2px;}
.d-item{
  background:#0e1628; border:1px solid rgba(0,180,255,0.12);
  border-radius:9px; padding:10px 13px;
  cursor:pointer; transition:all .15s; position:relative;
}
.d-item:hover{border-color:rgba(0,180,255,0.3);background:#141e32;}
.d-item.sel{border-color:#00b4ff;background:rgba(0,180,255,0.07);}
.d-item.sel::after{
  content:'✓'; position:absolute; top:8px; right:11px;
  font-size:10px; color:#00b4ff; font-weight:700;
}
.d-type{font-size:9px;letter-spacing:0.12em;margin-bottom:4px;font-weight:700;}
.d-type.q{color:#ff3a3a;} .d-type.w{color:#ff8c00;} .d-type.wa{color:#ffe600;}
.d-mag{font-size:20px;font-weight:900;line-height:1;margin-bottom:3px;}
.mag-hi{color:#ff3a3a;} .mag-md{color:#ff8c00;} .mag-lo{color:#00b4ff;}
.d-name{font-size:13px;font-weight:700;margin-bottom:3px;}
.d-meta{font-size:10px;color:#3d5a78;}
.badge{
  display:inline-block;padding:2px 7px;border-radius:4px;
  font-size:9px;font-weight:700;letter-spacing:0.06em;margin:2px 2px 0 0;
}
.badge-r{background:rgba(255,50,50,.14);color:#ff6060;border:1px solid rgba(255,50,50,.22);}
.badge-o{background:rgba(255,140,0,.12);color:#ffaa40;border:1px solid rgba(255,140,0,.2);}
.badge-y{background:rgba(255,230,0,.09);color:#ffd040;border:1px solid rgba(255,220,0,.16);}
.empty{text-align:center;padding:36px 16px;font-size:11px;color:#3d5a78;}
.empty-icon{font-size:26px;margin-bottom:8px;opacity:.5;}

/* ERROR BOX */
.err-box{
  background:rgba(255,50,50,0.07); border:1px solid rgba(255,50,50,0.2);
  border-radius:8px; padding:12px 14px; font-size:11px; color:#ff8080;
  margin-top:8px; line-height:1.6;
}
.err-box strong{display:block;margin-bottom:4px;color:#ff5050;}

/* OUTPUT */
.out-panel{grid-column:1/-1;}
@media(max-width:800px){.out-panel{grid-column:1;}}
.out-tabs{display:flex;border-bottom:1px solid rgba(0,180,255,0.1);}
.out-tab{
  padding:9px 18px; font-size:9px; letter-spacing:0.14em;
  color:#3d5a78; cursor:pointer; border-bottom:2px solid transparent;
  transition:all .15s; background:none; border-top:none; border-left:none; border-right:none;
  font-weight:700;
}
.out-tab:hover{color:#cce0f5;}
.out-tab.on{color:#00b4ff;border-bottom-color:#00b4ff;}
.out-area{
  min-height:150px; padding:18px 20px;
  font-size:14px; line-height:1.8; color:#cce0f5;
  white-space:pre-wrap; word-break:break-all;
}
.out-placeholder{color:#3d5a78;font-size:11px;text-align:center;padding:50px 20px;}
.out-footer{
  padding:10px 18px; border-top:1px solid rgba(0,180,255,0.1);
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(0,180,255,0.02);
}
.char-ct{font-size:10px;color:#3d5a78;font-family:monospace;}
.char-ct.over{color:#ff3a3a;}
.footer-btns{display:flex;gap:8px;}

/* SEP */
.sep{
  font-size:9px;letter-spacing:0.18em;color:#3d5a78;
  margin:13px 0 7px; display:flex;align-items:center;gap:7px;
}
.sep::after{content:'';flex:1;height:1px;background:rgba(0,180,255,0.1);}

/* STATUS */
.status{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(4,8,15,0.96);
  border-top:1px solid rgba(0,180,255,0.12);
  padding:8px 22px; display:flex; align-items:center; gap:10px;
}
.st-dot{width:6px;height:6px;border-radius:50%;background:#00e87a;box-shadow:0 0 7px #00e87a;flex-shrink:0;}
.st-dot.ld{background:#00b4ff;box-shadow:0 0 7px #00b4ff;animation:bdot .7s ease-in-out infinite;}
.st-dot.er{background:#ff3a3a;box-shadow:0 0 7px #ff3a3a;}
.st-txt{font-size:10px;color:#3d5a78;font-family:monospace;}

/* CURSOR / SPIN */
.cur{display:inline-block;width:2px;height:1em;background:#00b4ff;margin-left:2px;vertical-align:text-bottom;animation:cur .55s step-end infinite;}
@keyframes cur{0%,100%{opacity:1;}50%{opacity:0;}}
.sp{display:inline-block;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* DEMO BADGE */
.demo-badge{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-size:9px;font-weight:700;letter-spacing:0.08em;
  background:rgba(255,220,0,0.1);border:1px solid rgba(255,220,0,0.25);color:#ffd040;
  margin-left:8px;vertical-align:middle;
}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo-text">🛡 防災X投稿ジェネレーター</div>
    <span class="logo-sub">BOUSAI · X POST GENERATOR · POWERED BY CLAUDE AI</span>
  </div>
  <div class="api-row">
    <span class="api-label">ANTHROPIC API KEY</span>
    <input class="api-input" type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
  </div>
</header>

<div class="wrap">

  <!-- 地震パネル -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">
        <span class="blink-dot" style="background:#ff3a3a;box-shadow:0 0 7px #ff3a3a;"></span>
        地震情報（P2P地震情報API）
      </div>
      <button class="fetch-btn" id="qBtn" onclick="fetchQuakes()">
        <span id="qIco">↻</span> 取得
      </button>
    </div>
    <div class="panel-body">
      <div class="data-list" id="qList">
        <div class="empty"><div class="empty-icon">🌏</div>「取得」を押してください</div>
      </div>
      <div id="qErr" style="display:none;"></div>
    </div>
  </div>

  <!-- 警報パネル -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">
        <span class="blink-dot" style="background:#ff8c00;box-shadow:0 0 7px #ff8c00;"></span>
        気象警報・注意報（気象庁API）
      </div>
      <button class="fetch-btn" id="wBtn" onclick="fetchWarnings()">
        <span id="wIco">↻</span> 取得
      </button>
    </div>
    <div class="panel-body">
      <div class="data-list" id="wList">
        <div class="empty"><div class="empty-icon">⚠️</div>「取得」を押してください</div>
      </div>
      <div id="wErr" style="display:none;"></div>
    </div>
  </div>

  <!-- 生成パネル -->
  <div class="panel out-panel">
    <div class="panel-head">
      <div class="panel-title">
        <span class="blink-dot" style="background:#00b4ff;"></span>
        X投稿文 生成
      </div>
      <span style="font-size:10px;color:#00b4ff;font-weight:700;" id="selCnt">0件選択中</span>
    </div>
    <div class="panel-body">
      <div class="sep">投稿スタイル</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px;">
        <button class="tone-btn on" data-tone="official" onclick="setTone(this)">📢 公式速報</button>
        <button class="tone-btn" data-tone="alert"    onclick="setTone(this)">🚨 緊急警戒</button>
        <button class="tone-btn" data-tone="calm"     onclick="setTone(this)">📋 冷静詳細</button>
        <button class="tone-btn" data-tone="advice"   onclick="setTone(this)">💡 防災アドバイス</button>
        <button class="tone-btn" data-tone="thread"   onclick="setTone(this)">🧵 スレッド形式</button>
      </div>
      <div class="sep">言語</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;">
        <button class="tone-btn on" data-lang="ja"   onclick="setLang(this)">🇯🇵 日本語</button>
        <button class="tone-btn" data-lang="en"      onclick="setLang(this)">🇺🇸 English</button>
        <button class="tone-btn" data-lang="both"    onclick="setLang(this)">🌐 両方</button>
      </div>
      <button class="gen-btn" id="genBtn" onclick="generate()">
        <span id="genIco">✦</span>
        <span id="genTxt">Claude AI で投稿文を生成</span>
      </button>
    </div>

    <div id="outTabs" class="out-tabs" style="display:none;"></div>
    <div id="outArea" class="out-area">
      <div class="out-placeholder">← データを選択して「生成」ボタンを押してください</div>
    </div>
    <div class="out-footer">
      <div class="char-ct" id="charCt">— 文字</div>
      <div class="footer-btns">
        <button class="copy-btn" id="copyBtn" onclick="doCopy()">📋 コピー</button>
        <a class="x-btn" href="#" onclick="openX(event)">𝕏 X で開く</a>
      </div>
    </div>
  </div>

</div>

<div class="status">
  <div class="st-dot" id="stDot"></div>
  <div class="st-txt" id="stTxt">待機中 — データを取得して投稿文を生成してください</div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const S = {
  quakes: [],
  warns: [],
  sel: new Set(),
  tone: 'official',
  lang: 'ja',
  outs: [],
  tab: 0
};

// ─── Status bar ──────────────────────────────────────────────────────────────
function status(msg, type) {
  const dot = document.getElementById('stDot');
  dot.className = 'st-dot' + (type === 'ld' ? ' ld' : type === 'er' ? ' er' : '');
  document.getElementById('stTxt').textContent = msg;
}

// ─── Utility ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
function pad(n) { return String(n).padStart(2, '0'); }
function s2t(s) {
  return ({ 10:'1',20:'2',30:'3',40:'4',45:'5弱',50:'5強',55:'6弱',60:'6強',70:'7' })[s] || (s > 0 ? '' + Math.floor(s / 10) : '不明');
}
function lvCls(s) { return s >= 55 ? 'mag-hi' : s >= 40 ? 'mag-md' : 'mag-lo'; }

// ─── Safe fetch with timeout ──────────────────────────────────────────────────
async function safeFetch(url, opts = {}, timeoutMs = 10000) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { ...opts, signal: ctrl.signal });
    clearTimeout(tid);
    return r;
  } catch (e) {
    clearTimeout(tid);
    if (e.name === 'AbortError') throw new Error('タイムアウト（10秒）');
    throw e;
  }
}

// ─── Quakes ──────────────────────────────────────────────────────────────────
async function fetchQuakes() {
  const btn = document.getElementById('qBtn');
  const ico = document.getElementById('qIco');
  const errEl = document.getElementById('qErr');
  btn.disabled = true;
  ico.className = 'sp';
  ico.textContent = '↻';
  errEl.style.display = 'none';
  status('P2P地震情報API 取得中...', 'ld');

  try {
    const r = await safeFetch('https://api.p2pquake.net/v2/jma/quake?limit=15');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();

    S.quakes = (Array.isArray(raw) ? raw : [])
      .filter(it => it?.earthquake?.hypocenter?.name)
      .map(it => {
        const eq = it.earthquake;
        const h = eq.hypocenter;
        const raw_time = it.time || '';
        const d = new Date(raw_time.replace(/\//g, '-').replace(' ', 'T'));
        return {
          name: h.name || '不明',
          mag: h.magnitude >= 0 ? h.magnitude : null,
          depth: h.depth >= 0 ? h.depth : null,
          shindo: eq.maxScale > 0 ? eq.maxScale : 0,
          time: isNaN(d.getTime()) ? raw_time.slice(5,16)||'--'
            : (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes()),
          tsunami: eq.domesticTsunami || 'None'
        };
      });

    renderQ();
    status('地震データ取得完了 (' + S.quakes.length + '件)');
  } catch (e) {
    const msg = e.message || '不明なエラー';
    status('地震取得失敗: ' + msg, 'er');
    document.getElementById('qList').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div>取得できませんでした</div>';
    errEl.innerHTML = `<div class="err-box">
      <strong>取得エラー</strong>
      ${esc(msg)}<br>
      <span style="color:#665;">CORSまたはネットワークエラーの場合、ブラウザの制限が原因です。<br>
      Chromeなら「--disable-web-security」オプションで回避できます。</span>
    </div>`;
    errEl.style.display = 'block';
  } finally {
    ico.className = '';
    ico.textContent = '↻';
    btn.disabled = false;
  }
}

function renderQ() {
  const el = document.getElementById('qList');
  if (!S.quakes.length) {
    el.innerHTML = '<div class="empty">データなし</div>';
    return;
  }
  el.innerHTML = S.quakes.map((q, i) => `
    <div class="d-item${S.sel.has('q'+i) ? ' sel' : ''}" id="q${i}" onclick="tog('q${i}')">
      <div class="d-type q">// EARTHQUAKE</div>
      <div class="d-mag ${lvCls(q.shindo)}">M${q.mag != null ? q.mag.toFixed(1) : '?'}</div>
      <div class="d-name">${esc(q.name)}</div>
      <div class="d-meta">🕐 ${esc(q.time)} | 深さ ${q.depth != null ? q.depth + 'km' : '不明'} | 最大震度 ${s2t(q.shindo)}${q.tsunami !== 'None' ? ' | 🌊津波情報あり' : ''}</div>
    </div>`).join('');
}

// ─── Warnings ────────────────────────────────────────────────────────────────
const WC = {
  '02':'大雨警報','03':'洪水警報','04':'強風警報','05':'波浪警報',
  '06':'暴風雪警報','07':'大雪警報','10':'暴風警報',
  '14':'大雨注意報','15':'洪水注意報','16':'強風注意報','17':'波浪注意報',
  '18':'雷注意報','19':'融雪注意報','20':'濃霧注意報','21':'乾燥注意報',
  '22':'なだれ注意報','23':'低温注意報','24':'霜注意報','25':'着氷注意報',
  '26':'着雪注意報','32':'暴風雪注意報','33':'大雪注意報'
};
const WS = {
  '02':'r','03':'r','10':'r','06':'r','07':'r','04':'r','05':'r',
  '14':'o','15':'o','16':'o','17':'o','32':'o','33':'o',
  '18':'y','19':'y','20':'y','21':'y','22':'y','23':'y','24':'y','25':'y','26':'y'
};

async function fetchWarnings() {
  const btn = document.getElementById('wBtn');
  const ico = document.getElementById('wIco');
  const errEl = document.getElementById('wErr');
  btn.disabled = true;
  ico.className = 'sp';
  ico.textContent = '↻';
  errEl.style.display = 'none';
  status('気象庁API 取得中...', 'ld');

  // 気象庁APIはCORSヘッダーが不安定。複数URLを試みる
  const urls = [
    'https://www.jma.go.jp/bosai/warning/data/warning/all.json',
    'https://jma-cors-proxy.vercel.app/bosai/warning/data/warning/all.json' // fallback (存在しない場合は単にfailする)
  ];

  let data = null;
  let lastErr = null;

  for (const url of urls) {
    try {
      const r = await safeFetch(url, {}, 8000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
      break;
    } catch (e) {
      lastErr = e;
    }
  }

  if (!data) {
    const msg = lastErr?.message || '不明なエラー';
    status('警報取得失敗: ' + msg, 'er');
    document.getElementById('wList').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div>取得できませんでした</div>';
    errEl.innerHTML = `<div class="err-box">
      <strong>取得エラー: ${esc(msg)}</strong>
      気象庁APIはブラウザからの直接アクセスがCORSエラーになる場合があります。<br>
      <span style="color:#665;">💡 デモデータで試すには下の「デモデータを使う」ボタンをお試しください。</span>
    </div>
    <button class="fetch-btn" style="margin-top:10px;width:100%;justify-content:center;" onclick="loadDemoWarnings()">📦 デモデータを使う</button>`;
    errEl.style.display = 'block';
    ico.className = '';
    ico.textContent = '↻';
    btn.disabled = false;
    return;
  }

  try {
    const list = [];
    const sv = { r: 0, o: 1, y: 2 };
    for (const [, area] of Object.entries(data)) {
      if (!area?.warnings) continue;
      const active = area.warnings.filter(w => w.status === '発表' || w.status === '継続');
      if (!active.length) continue;
      const items = active.map(w => ({
        code: w.code,
        name: WC[w.code] || ('コード' + w.code),
        sev: WS[w.code] || 'y'
      }));
      list.push({ name: area.areaName || '?', items });
    }
    list.sort((a, b) =>
      Math.min(...a.items.map(i => sv[i.sev] ?? 9)) -
      Math.min(...b.items.map(i => sv[i.sev] ?? 9))
    );
    S.warns = list.slice(0, 50);
    renderW();
    status('警報・注意報取得完了 (' + S.warns.length + 'エリア)');
  } catch (e) {
    status('警報パース失敗: ' + e.message, 'er');
  } finally {
    ico.className = '';
    ico.textContent = '↻';
    btn.disabled = false;
  }
}

// デモデータ（CORSエラー時の代替）
function loadDemoWarnings() {
  S.warns = [
    { name: '東京都', items: [{ code:'10', name:'暴風警報', sev:'r' }, { code:'03', name:'洪水警報', sev:'r' }] },
    { name: '神奈川県', items: [{ code:'05', name:'波浪警報', sev:'r' }, { code:'18', name:'雷注意報', sev:'y' }] },
    { name: '埼玉県', items: [{ code:'14', name:'大雨注意報', sev:'o' }, { code:'18', name:'雷注意報', sev:'y' }] },
    { name: '千葉県', items: [{ code:'20', name:'濃霧注意報', sev:'y' }] },
  ];
  renderW();
  document.getElementById('wErr').style.display = 'none';
  status('デモデータを読み込みました（実際のデータではありません）');
}

function renderW() {
  const el = document.getElementById('wList');
  if (!S.warns.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>現在、有効な警報・注意報はありません</div>';
    return;
  }
  el.innerHTML = S.warns.map((w, i) => `
    <div class="d-item${S.sel.has('w'+i) ? ' sel' : ''}" id="w${i}" onclick="tog('w${i}')">
      <div class="d-type ${w.items.some(x => x.sev === 'r') ? 'w' : 'wa'}">
        ${w.items.some(x => x.sev === 'r') ? '// WARNING 警報' : '// ADVISORY 注意報'}
      </div>
      <div class="d-name" style="margin-bottom:5px;">${esc(w.name)}</div>
      <div>${w.items.map(it => `<span class="badge badge-${it.sev}">${esc(it.name)}</span>`).join('')}</div>
    </div>`).join('');
}

// ─── Selection ───────────────────────────────────────────────────────────────
function tog(id) {
  if (S.sel.has(id)) {
    S.sel.delete(id);
  } else {
    S.sel.add(id);
  }
  const el = document.getElementById(id);
  if (el) el.classList.toggle('sel', S.sel.has(id));
  document.getElementById('selCnt').textContent = S.sel.size + '件選択中';
}

// ─── Tone / Lang ─────────────────────────────────────────────────────────────
function setTone(b) {
  document.querySelectorAll('[data-tone]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  S.tone = b.dataset.tone;
}
function setLang(b) {
  document.querySelectorAll('[data-lang]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  S.lang = b.dataset.lang;
}

// ─── Generate ────────────────────────────────────────────────────────────────
const TONE_PROMPT = {
  official: '防災機関の公式アカウントが発信する、正確で信頼性の高い速報スタイル。ハッシュタグは #地震速報 #防災 など適切なものを付ける。',
  alert:    '緊急感・警戒感を前面に出した強調スタイル。⚠️🚨などの絵文字を効果的に使用。読み手に即座の行動を促す文体。',
  calm:     '冷静で詳細な情報提供スタイル。数値・状況を正確に伝え、専門的かつ読みやすく。過度な感情表現は避ける。',
  advice:   '防災アドバイス・行動指針を重視。「〇〇してください」など具体的な行動提案を必ず含む。',
  thread:   'Xのスレッド形式で3投稿に分割。①速報概要 ②詳細情報 ③行動指針＋ハッシュタグ。各投稿を空行2つで区切る。',
};

async function generate() {
  if (!S.sel.size) {
    status('データを1件以上選択してください', 'er');
    return;
  }
  const key = document.getElementById('apiKey').value.trim();
  if (!key) {
    status('APIキーを入力してください', 'er');
    return;
  }
  if (!key.startsWith('sk-ant-')) {
    status('APIキーの形式が正しくありません（sk-ant-... で始まる必要があります）', 'er');
    return;
  }

  // 選択データ収集
  const items = [];
  for (const id of S.sel) {
    if (id.startsWith('q')) {
      const q = S.quakes[+id.slice(1)];
      if (q) items.push(`【地震】震源:${q.name} M${q.mag != null ? q.mag.toFixed(1) : '不明'} 深さ${q.depth != null ? q.depth + 'km' : '不明'} 最大震度${s2t(q.shindo)} 発生:${q.time}${q.tsunami !== 'None' ? ' 津波情報あり' : ''}`);
    } else {
      const w = S.warns[+id.slice(1)];
      if (w) items.push(`【気象警報】${w.name}: ${w.items.map(i => i.name).join('、')}`);
    }
  }

  const langP = S.lang === 'ja' ? '日本語のみ。'
    : S.lang === 'en' ? '英語のみ（280字以内）。'
    : '日本語版と英語版を両方。---で区切る。';
  const isThread = S.tone === 'thread';

  const sys = `あなたは防災情報をXに発信する専門アカウントの担当者です。
スタイル指示: ${TONE_PROMPT[S.tone]}
言語: ${langP}
文字数: ${isThread ? '各投稿140字以内（スレッド番号付き）' : '140字以内'}
注意: 事実のみ記載。投稿文のみ出力（説明・前置き不要）。`;

  // UI更新
  const gb = document.getElementById('genBtn');
  const gi = document.getElementById('genIco');
  const gt = document.getElementById('genTxt');
  gb.disabled = true;
  gi.className = 'sp';
  gi.textContent = '↻';
  gt.textContent = '生成中...';
  status('Claude AI が投稿文を生成中...', 'ld');
  document.getElementById('outTabs').style.display = 'none';
  document.getElementById('outArea').innerHTML = '<span class="cur"></span>';
  document.getElementById('charCt').textContent = '— 文字';

  let full = '';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        stream: true,
        system: sys,
        messages: [{ role: 'user', content: '以下の情報をもとに投稿文を作成してください:\n\n' + items.join('\n') }]
      })
    });

    if (!res.ok) {
      let errMsg = 'API Error ' + res.status;
      try {
        const e = await res.json();
        errMsg = e?.error?.message || errMsg;
      } catch (_) {}
      throw new Error(errMsg);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      // SSEを行単位で処理（バッファリングして確実にパース）
      const lines = buf.split('\n');
      buf = lines.pop(); // 最後の不完全な行をバッファへ残す

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const raw = trimmed.slice(5).trim();
        if (raw === '[DONE]') continue;
        try {
          const p = JSON.parse(raw);
          if (p.type === 'content_block_delta' && p.delta?.type === 'text_delta' && p.delta.text) {
            full += p.delta.text;
            document.getElementById('outArea').innerHTML = esc(full) + '<span class="cur"></span>';
          }
        } catch (_) {}
      }
    }

    // スレッド形式は連続する空行で分割
    S.outs = isThread
      ? full.split(/\n{2,}/).map(s => s.trim()).filter(Boolean)
      : [full.trim()];
    S.tab = 0;
    buildTabs();
    showTab(0);
    status('投稿文の生成完了 ✓');

  } catch (e) {
    const msg = e.message || '不明なエラー';
    document.getElementById('outArea').innerHTML =
      '<span style="color:#ff5050;font-size:13px;">⚠ エラー: ' + esc(msg) + '</span>';
    status('生成エラー: ' + msg, 'er');
  } finally {
    gb.disabled = false;
    gi.className = '';
    gi.textContent = '✦';
    gt.textContent = 'Claude AI で投稿文を生成';
  }
}

// ─── Tabs ────────────────────────────────────────────────────────────────────
function buildTabs() {
  const el = document.getElementById('outTabs');
  if (S.outs.length <= 1) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'flex';
  el.innerHTML = S.outs.map((_, i) =>
    `<button class="out-tab${i === 0 ? ' on' : ''}" data-i="${i}" onclick="clickTab(this)">投稿${i + 1}</button>`
  ).join('');
}

function clickTab(b) {
  document.querySelectorAll('.out-tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  S.tab = +b.dataset.i;
  showTab(S.tab);
}

function showTab(i) {
  const t = S.outs[i] || '';
  const el = document.getElementById('outArea');
  el.textContent = t;
  const ct = document.getElementById('charCt');
  ct.textContent = t.length + ' 文字';
  ct.className = 'char-ct' + (t.length > 140 ? ' over' : '');
}

// ─── Copy / X ─────────────────────────────────────────────────────────────────
function doCopy() {
  const t = S.outs[S.tab] || '';
  if (!t) { status('コピーする投稿文がありません', 'er'); return; }
  navigator.clipboard.writeText(t).then(() => {
    const b = document.getElementById('copyBtn');
    b.textContent = '✓ コピー済み';
    b.classList.add('ok');
    setTimeout(() => { b.textContent = '📋 コピー'; b.classList.remove('ok'); }, 2000);
  }).catch(() => {
    // clipboard API が使えない場合のフォールバック
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    status('クリップボードにコピーしました');
  });
}

function openX(e) {
  e.preventDefault();
  const t = S.outs[S.tab] || '';
  if (!t) { status('投稿文がありません', 'er'); return; }
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(t), '_blank');
}
