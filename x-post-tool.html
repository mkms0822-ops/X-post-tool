<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防災X投稿ジェネレーター</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04080f;
  --surface: #0a1020;
  --surface2: #0e1628;
  --surface3: #141e32;
  --border: rgba(0,180,255,0.13);
  --border-bright: rgba(0,180,255,0.35);
  --blue: #00b4ff;
  --cyan: #00ffe0;
  --accent: #ff3a3a;
  --accent2: #ff8c00;
  --safe: #00e87a;
  --yellow: #ffe600;
  --text: #cce0f5;
  --muted: #3d5a78;
  --glow: 0 0 20px rgba(0,180,255,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 10% 20%, rgba(0,100,200,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 90% 80%, rgba(0,50,120,0.05) 0%, transparent 70%);
}
body::after{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(0,180,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,180,255,0.025) 1px, transparent 1px);
  background-size:40px 40px;
}

/* HEADER */
header{
  position:sticky; top:0; z-index:100;
  background:rgba(4,8,15,0.95); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 32px; height:62px;
  display:flex; align-items:center; justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  box-shadow:0 0 12px rgba(0,180,255,0.3);
}
.logo-text{font-family:'Orbitron',monospace;font-size:15px;font-weight:900;color:var(--blue);letter-spacing:0.05em;}
.logo-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.2em;display:block;margin-top:1px;}
.header-right{display:flex;align-items:center;gap:14px;}

/* API KEY INPUT */
.api-key-wrap{display:flex;align-items:center;gap:8px;}
.api-key-label{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.12em;}
.api-key-input{
  width:240px; padding:6px 12px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:6px; color:var(--text);
  font-family:'Share Tech Mono',monospace; font-size:11px;
  outline:none; transition:border-color 0.2s;
}
.api-key-input:focus{border-color:var(--blue);}
.api-key-input::placeholder{color:var(--muted);}

/* MAIN LAYOUT */
.main-wrap{
  position:relative; z-index:1;
  max-width:1200px; margin:0 auto;
  padding:28px 24px;
  display:grid; grid-template-columns:1fr 1fr;
  gap:20px;
}

/* PANEL */
.panel{
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; overflow:hidden;
}
.panel-head{
  padding:14px 20px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(0,180,255,0.03);
}
.panel-title{
  font-family:'Orbitron',monospace; font-size:10px;
  letter-spacing:0.2em; color:var(--blue);
  display:flex; align-items:center; gap:8px;
}
.panel-title .dot{
  width:7px;height:7px;border-radius:50%;background:var(--blue);
  box-shadow:0 0 8px var(--blue); animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.panel-body{padding:18px 20px;}

/* FETCH BUTTON */
.fetch-btn{
  display:flex;align-items:center;gap:7px;
  padding:6px 14px; border-radius:20px;
  background:rgba(0,180,255,0.1); border:1px solid rgba(0,180,255,0.3);
  color:var(--blue); font-family:'Orbitron',monospace;
  font-size:9px; letter-spacing:0.12em; cursor:pointer; transition:all 0.2s;
}
.fetch-btn:hover{background:rgba(0,180,255,0.2);}
.fetch-btn:disabled{opacity:0.4;cursor:not-allowed;}
.spin{animation:spinA 1s linear infinite;}
@keyframes spinA{to{transform:rotate(360deg);}}

/* DATA ITEMS */
.data-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
.data-list::-webkit-scrollbar{width:4px;}
.data-list::-webkit-scrollbar-thumb{background:rgba(0,180,255,0.2);border-radius:2px;}
.data-item{
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:11px 14px;
  cursor:pointer; transition:all 0.15s; user-select:none;
  position:relative;
}
.data-item:hover{border-color:var(--border-bright);background:var(--surface3);}
.data-item.selected{
  border-color:var(--blue);
  background:rgba(0,180,255,0.07);
  box-shadow:0 0 0 1px rgba(0,180,255,0.15);
}
.data-item.selected::before{
  content:'✓'; position:absolute; top:8px; right:12px;
  font-size:11px; color:var(--blue); font-weight:700;
}
.item-type{
  font-family:'Share Tech Mono',monospace; font-size:9px;
  letter-spacing:0.12em; margin-bottom:5px;
}
.item-type.quake{color:var(--accent);}
.item-type.warning{color:var(--accent2);}
.item-type.advisory{color:var(--yellow);}
.item-mag{
  font-family:'Orbitron',monospace; font-size:20px; font-weight:900;
  line-height:1; margin-bottom:4px;
}
.item-mag.lv-high{color:var(--accent);}
.item-mag.lv-mid{color:var(--accent2);}
.item-mag.lv-low{color:var(--blue);}
.item-name{font-size:13px;font-weight:700;margin-bottom:3px;}
.item-meta{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);}
.empty-state{
  text-align:center;padding:40px 20px;
  font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);
}
.empty-icon{font-size:28px;margin-bottom:10px;opacity:0.5;}

/* TONE SELECTOR */
.tone-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tone-btn{
  padding:6px 14px; border-radius:20px;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--muted); font-family:'Share Tech Mono',monospace;
  font-size:10px; letter-spacing:0.08em; cursor:pointer; transition:all 0.15s;
}
.tone-btn:hover{border-color:var(--border-bright);color:var(--text);}
.tone-btn.active{
  background:rgba(0,180,255,0.12); border-color:var(--blue); color:var(--blue);
}

/* GENERATE BUTTON */
.gen-btn{
  width:100%; padding:13px;
  background:linear-gradient(135deg,rgba(0,130,220,0.2),rgba(0,180,255,0.1));
  border:1px solid rgba(0,180,255,0.4); border-radius:10px;
  color:var(--blue); font-family:'Orbitron',monospace;
  font-size:11px; letter-spacing:0.15em; cursor:pointer;
  transition:all 0.2s; display:flex; align-items:center;
  justify-content:center; gap:8px; margin-bottom:16px;
}
.gen-btn:hover{background:linear-gradient(135deg,rgba(0,130,220,0.35),rgba(0,180,255,0.2));box-shadow:var(--glow);}
.gen-btn:disabled{opacity:0.35;cursor:not-allowed;}

/* OUTPUT AREA */
.output-panel{grid-column:1/-1;}
.output-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);}
.out-tab{
  padding:10px 20px; font-family:'Orbitron',monospace; font-size:9px;
  letter-spacing:0.15em; color:var(--muted); cursor:pointer;
  border-bottom:2px solid transparent; transition:all 0.15s; background:none;
  border-top:none;border-left:none;border-right:none;
}
.out-tab:hover{color:var(--text);}
.out-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.output-area{
  min-height:160px; padding:18px 20px;
  font-family:'Noto Sans JP',sans-serif; font-size:14px;
  line-height:1.75; color:var(--text);
  white-space:pre-wrap; word-break:break-all;
}
.output-placeholder{
  color:var(--muted); font-family:'Share Tech Mono',monospace;
  font-size:11px; text-align:center; padding:50px 20px;
}
.output-footer{
  padding:12px 20px; border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(0,180,255,0.02);
}
.char-count{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);}
.char-count.over{color:var(--accent);}
.copy-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 18px; border-radius:20px;
  background:rgba(0,180,255,0.1); border:1px solid rgba(0,180,255,0.3);
  color:var(--blue); font-family:'Orbitron',monospace;
  font-size:9px; letter-spacing:0.12em; cursor:pointer; transition:all 0.2s;
}
.copy-btn:hover{background:rgba(0,180,255,0.22);}
.copy-btn.copied{background:rgba(0,232,122,0.12);border-color:rgba(0,232,122,0.4);color:var(--safe);}
.x-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 18px; border-radius:20px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
  color:#e7e9ea; font-family:'Orbitron',monospace;
  font-size:9px; letter-spacing:0.12em; cursor:pointer; transition:all 0.2s;
  text-decoration:none;
}
.x-btn:hover{background:rgba(255,255,255,0.12);}
.footer-btns{display:flex;gap:8px;align-items:center;}

/* LOADING STREAM */
.streaming-cursor{
  display:inline-block; width:2px; height:1em;
  background:var(--blue); margin-left:2px; vertical-align:text-bottom;
  animation:blink 0.6s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* STATUS BAR */
.status-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:rgba(4,8,15,0.9); backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:8px 24px; display:flex; align-items:center; gap:12px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--safe);box-shadow:0 0 8px var(--safe);}
.status-dot.loading{background:var(--blue);box-shadow:0 0 8px var(--blue);animation:pulse 0.8s ease-in-out infinite;}
.status-dot.error{background:var(--accent);box-shadow:0 0 8px var(--accent);}
.status-text{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);}

/* DIVIDER LABEL */
.section-label{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  letter-spacing:0.2em;color:var(--muted);
  margin:14px 0 8px; display:flex;align-items:center;gap:8px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* WARNING BADGE */
.warn-badge{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-family:'Share Tech Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:0.08em;margin-right:4px;
}
.warn-badge.red{background:rgba(255,45,45,0.15);color:#ff6060;border:1px solid rgba(255,45,45,0.25);}
.warn-badge.orange{background:rgba(255,140,0,0.12);color:#ffaa40;border:1px solid rgba(255,140,0,0.2);}
.warn-badge.yellow{background:rgba(255,230,0,0.10);color:#ffd040;border:1px solid rgba(255,220,0,0.18);}

/* RESPONSIVE */
@media(max-width:860px){
  .main-wrap{grid-template-columns:1fr;}
  .output-panel{grid-column:1;}
  .api-key-input{width:160px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">𝕏</div>
    <div>
      <div class="logo-text">防災X投稿ジェネレーター</div>
      <span class="logo-sub">BOUSAI · X POST GENERATOR · POWERED BY CLAUDE AI</span>
    </div>
  </div>
  <div class="header-right">
    <div class="api-key-wrap">
      <span class="api-key-label">API KEY</span>
      <input class="api-key-input" type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
    </div>
  </div>
</header>

<div class="main-wrap">

  <!-- 地震情報パネル -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">
        <div class="dot" style="background:var(--accent);box-shadow:0 0 8px var(--accent);"></div>
        地震情報（P2P地震情報API）
      </div>
      <button class="fetch-btn" id="fetchQuakeBtn" onclick="fetchQuakes()">
        <span id="quakeSpinIcon">↻</span> 取得
      </button>
    </div>
    <div class="panel-body">
      <div class="data-list" id="quakeList">
        <div class="empty-state">
          <div class="empty-icon">🌏</div>
          「取得」を押して最新の地震データを読み込みます
        </div>
      </div>
    </div>
  </div>

  <!-- 気象警報パネル -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">
        <div class="dot" style="background:var(--accent2);box-shadow:0 0 8px var(--accent2);"></div>
        気象警報・注意報（気象庁API）
      </div>
      <button class="fetch-btn" id="fetchWarnBtn" onclick="fetchWarnings()">
        <span id="warnSpinIcon">↻</span> 取得
      </button>
    </div>
    <div class="panel-body">
      <div class="data-list" id="warnList">
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          「取得」を押して全国の警報・注意報を読み込みます
        </div>
      </div>
    </div>
  </div>

  <!-- 投稿生成パネル -->
  <div class="panel output-panel">
    <div class="panel-head">
      <div class="panel-title">
        <div class="dot"></div>
        X投稿文 生成
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.12em;">選択中:</span>
        <span id="selectedCount" style="font-family:'Orbitron',monospace;font-size:11px;color:var(--blue);">0件</span>
      </div>
    </div>
    <div class="panel-body" style="padding-bottom:8px;">

      <div class="section-label">投稿スタイル</div>
      <div class="tone-row">
        <button class="tone-btn active" data-tone="official" onclick="selectTone(this)">📢 公式・速報</button>
        <button class="tone-btn" data-tone="alert" onclick="selectTone(this)">🚨 緊急・警戒</button>
        <button class="tone-btn" data-tone="calm" onclick="selectTone(this)">📋 冷静・詳細</button>
        <button class="tone-btn" data-tone="advice" onclick="selectTone(this)">💡 防災アドバイス</button>
        <button class="tone-btn" data-tone="thread" onclick="selectTone(this)">🧵 スレッド形式</button>
      </div>

      <div class="section-label">投稿言語</div>
      <div class="tone-row">
        <button class="tone-btn active" data-lang="ja" onclick="selectLang(this)">🇯🇵 日本語</button>
        <button class="tone-btn" data-lang="en" onclick="selectLang(this)">🇺🇸 English</button>
        <button class="tone-btn" data-lang="both" onclick="selectLang(this)">🌐 両方</button>
      </div>

      <button class="gen-btn" id="genBtn" onclick="generatePost()">
        <span id="genBtnIcon">✦</span>
        <span id="genBtnText">Claude AIで投稿文を生成</span>
      </button>

    </div>

    <!-- 出力タブ -->
    <div class="output-tabs" id="outputTabs" style="display:none;">
      <button class="out-tab active" data-idx="0" onclick="switchTab(this)">投稿①</button>
    </div>
    <div id="outputArea" class="output-area">
      <div class="output-placeholder">
        ← データを選択して「生成」ボタンを押してください
      </div>
    </div>
    <div class="output-footer">
      <div class="char-count" id="charCount">— 文字</div>
      <div class="footer-btns">
        <button class="copy-btn" id="copyBtn" onclick="copyText()">📋 コピー</button>
        <a class="x-btn" id="xShareBtn" href="#" target="_blank" onclick="openX(event)">𝕏 X で開く</a>
      </div>
    </div>
  </div>

</div>

<!-- Status Bar -->
<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <div class="status-text" id="statusText">待機中 — データを取得して投稿文を生成してください</div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
const state = {
  quakes: [],
  warnings: [],
  selected: new Set(),   // "q_{i}" or "w_{i}"
  tone: 'official',
  lang: 'ja',
  outputs: [],           // 生成された投稿文（スレッドなら複数）
  currentTab: 0,
};

// ============================================================
// STATUS
// ============================================================
function setStatus(msg, type='idle'){
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className  = 'status-dot' + (type==='loading'?' loading':type==='error'?' error':'');
  text.textContent = msg;
}

// ============================================================
// QUAKE FETCH  (P2P地震情報API)
// ============================================================
const P2P_URL = 'https://api.p2pquake.net/v2/jma/quake?limit=15';

function scaleToText(s){
  const m={10:'1',20:'2',30:'3',40:'4',45:'5弱',50:'5強',55:'6弱',60:'6強',70:'7'};
  return m[s] || (s>0 ? String(Math.floor(s/10)) : '不明');
}
function getLvClass(s){
  if(s>=55) return 'lv-high';
  if(s>=40) return 'lv-mid';
  return 'lv-low';
}

async function fetchQuakes(){
  const btn = document.getElementById('fetchQuakeBtn');
  const ico = document.getElementById('quakeSpinIcon');
  btn.disabled = true;
  ico.className = 'spin'; ico.textContent = '↻';
  setStatus('P2P地震情報APIからデータを取得中...','loading');
  try{
    const r = await fetch(P2P_URL);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const raw = await r.json();
    state.quakes = (Array.isArray(raw)?raw:[])
      .filter(it=>it.earthquake?.hypocenter?.name)
      .map(it=>{
        const eq=it.earthquake, hyp=eq.hypocenter;
        const d=new Date((it.time||'').replace(/\//g,'-').replace(' ','T'));
        return {
          name: hyp.name||'震源不明',
          mag:  hyp.magnitude!=null&&hyp.magnitude>=0 ? hyp.magnitude : null,
          depth:hyp.depth!=null&&hyp.depth>=0 ? hyp.depth : null,
          shindo: eq.maxScale>0 ? eq.maxScale : 0,
          time: isNaN(d)?'--':((d.getMonth()+1)+'/'+ d.getDate()+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')),
          tsunami: eq.domesticTsunami||'None',
        };
      });
    renderQuakeList();
    setStatus('地震データ取得完了 ('+state.quakes.length+'件)');
  }catch(e){
    setStatus('地震データ取得失敗: '+e.message,'error');
    document.getElementById('quakeList').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div>取得に失敗しました。再試行してください。</div>';
  }
  ico.className=''; ico.textContent='↻'; btn.disabled=false;
}

function renderQuakeList(){
  const el = document.getElementById('quakeList');
  if(!state.quakes.length){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">🌏</div>地震データがありません</div>'; return;
  }
  el.innerHTML = state.quakes.map((q,i)=>`
    <div class="data-item" id="q_${i}" onclick="toggleSelect('q_${i}')">
      <div class="item-type quake">// EARTHQUAKE</div>
      <div class="item-mag ${getLvClass(q.shindo)}">M${q.mag!=null?q.mag.toFixed(1):'?'}</div>
      <div class="item-name">${q.name}</div>
      <div class="item-meta">
        🕐 ${q.time} &nbsp;|&nbsp; 深さ ${q.depth!=null?q.depth+'km':'不明'} &nbsp;|&nbsp; 最大震度 ${scaleToText(q.shindo)}
        ${q.tsunami!='None'?'&nbsp;|&nbsp; <span style="color:var(--accent)">🌊 津波情報あり</span>':''}
      </div>
    </div>`).join('');
}

// ============================================================
// WARNING FETCH (気象庁 警報・注意報)
// ============================================================
// 気象庁の警報APIから全国データを取得してパース
const WARN_URL = 'https://www.jma.go.jp/bosai/warning/data/warning/all.json';

const WARN_CODES = {
  '02':'大雨警報','03':'洪水警報','04':'強風警報','05':'波浪警報',
  '06':'暴風雪警報','07':'大雪警報','10':'暴風警報',
  '14':'大雨注意報','15':'洪水注意報','16':'強風注意報','17':'波浪注意報',
  '18':'雷注意報','19':'融雪注意報','20':'濃霧注意報','21':'乾燥注意報',
  '22':'なだれ注意報','23':'低温注意報','24':'霜注意報','25':'着氷注意報',
  '26':'着雪注意報','32':'暴風雪注意報','33':'大雪注意報',
};
const WARN_SEVERITY = { // 表示用グレード
  '02':'red','03':'red','10':'red','06':'red','07':'red','04':'red','05':'red',
  '14':'orange','15':'orange','16':'orange','17':'orange','18':'yellow',
  '19':'yellow','20':'yellow','21':'yellow','22':'yellow','23':'yellow',
  '24':'yellow','25':'yellow','26':'yellow','32':'orange','33':'orange',
};

async function fetchWarnings(){
  const btn = document.getElementById('fetchWarnBtn');
  const ico = document.getElementById('warnSpinIcon');
  btn.disabled=true; ico.className='spin'; ico.textContent='↻';
  setStatus('気象庁から警報・注意報データを取得中...','loading');
  try{
    const r = await fetch(WARN_URL);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();

    // エリアごとに警報・注意報を集計
    const alerts = [];
    for(const [areaCode, areaData] of Object.entries(data)){
      if(!areaData.warnings) continue;
      const active = areaData.warnings.filter(w=>w.status==='発表' || w.status==='継続');
      if(!active.length) continue;
      const areaName = areaData.areaName||areaCode;
      const warnItems = active.map(w=>({
        code: w.code,
        name: WARN_CODES[w.code]||('警報コード'+w.code),
        severity: WARN_SEVERITY[w.code]||'yellow',
        status: w.status,
      }));
      alerts.push({ areaName, areaCode, items: warnItems });
    }

    // 警報優先でソート（赤→橙→黄）
    const sev={red:0,orange:1,yellow:2};
    alerts.sort((a,b)=>{
      const sa=Math.min(...a.items.map(i=>sev[i.severity]??9));
      const sb=Math.min(...b.items.map(i=>sev[i.severity]??9));
      return sa-sb;
    });

    state.warnings = alerts.slice(0,40); // 上位40件
    renderWarnList();
    setStatus('警報・注意報取得完了 ('+state.warnings.length+'エリア)');
  }catch(e){
    setStatus('警報データ取得失敗: '+e.message,'error');
    document.getElementById('warnList').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div>取得に失敗しました。</div>';
  }
  ico.className=''; ico.textContent='↻'; btn.disabled=false;
}

function renderWarnList(){
  const el = document.getElementById('warnList');
  if(!state.warnings.length){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">✅</div>現在、有効な警報・注意報はありません</div>'; return;
  }
  el.innerHTML = state.warnings.map((w,i)=>{
    const badges = w.items.map(it=>
      `<span class="warn-badge ${it.severity}">${it.name}</span>`
    ).join('');
    const hasWarn = w.items.some(it=>it.severity==='red');
    return `
    <div class="data-item" id="w_${i}" onclick="toggleSelect('w_${i}')">
      <div class="item-type warning">// ${hasWarn?'WARNING 警報':'ADVISORY 注意報'}</div>
      <div class="item-name" style="margin-bottom:6px;">${w.areaName}</div>
      <div style="flex-wrap:wrap;">${badges}</div>
    </div>`;
  }).join('');
}

// ============================================================
// SELECTION
// ============================================================
function toggleSelect(id){
  if(state.selected.has(id)){
    state.selected.delete(id);
    document.getElementById(id)?.classList.remove('selected');
  } else {
    state.selected.add(id);
    document.getElementById(id)?.classList.add('selected');
  }
  document.getElementById('selectedCount').textContent = state.selected.size+'件';
}

// ============================================================
// TONE / LANG
// ============================================================
function selectTone(btn){
  document.querySelectorAll('.tone-btn[data-tone]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.tone = btn.dataset.tone;
}
function selectLang(btn){
  document.querySelectorAll('.tone-btn[data-lang]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.lang = btn.dataset.lang;
}

// ============================================================
// GENERATE (Claude API streaming)
// ============================================================
async function generatePost(){
  if(!state.selected.size){
    setStatus('データを1件以上選択してください','error'); return;
  }
  const apiKey = document.getElementById('apiKey').value.trim();
  if(!apiKey){
    setStatus('APIキーを入力してください','error'); return;
  }

  // 選択データをまとめる
  const items = [];
  for(const id of state.selected){
    if(id.startsWith('q_')){
      const q = state.quakes[parseInt(id.slice(2))];
      if(q) items.push({
        type:'地震',
        data:`震源: ${q.name} / M${q.mag!=null?q.mag.toFixed(1):'不明'} / 深さ${q.depth!=null?q.depth+'km':'不明'} / 最大震度${scaleToText(q.shindo)} / 発生時刻:${q.time}${q.tsunami!='None'?' / 津波情報あり':''}`
      });
    } else if(id.startsWith('w_')){
      const w = state.warnings[parseInt(id.slice(2))];
      if(w) items.push({
        type:'気象警報',
        data:`${w.areaName}: ${w.items.map(i=>i.name).join('、')}`
      });
    }
  }

  const tonePrompts = {
    official: '防災機関の公式アカウントが発信する、正確で信頼性の高い速報スタイル。ハッシュタグは #地震速報 #防災 など適切なものを付ける。',
    alert:    '緊急感・警戒感を前面に出した強調スタイル。⚠️🚨などの絵文字を効果的に使用。読み手に即座に行動を促す文体。',
    calm:     '冷静で詳細な情報提供スタイル。数値や状況を正確に伝える。過度な感情表現は避け、専門的かつ読みやすく。',
    advice:   '防災アドバイス・行動指針を重視したスタイル。「〇〇してください」「〇〇に注意を」などの具体的な行動提案を含む。',
    thread:   'Xのスレッド形式で複数投稿に分割。1投稿目は速報・概要、2投稿目は詳細情報、3投稿目は行動指針・ハッシュタグ。',
  };
  const langPrompt = state.lang==='ja' ? '日本語のみで書いてください。' :
                     state.lang==='en' ? '英語のみで書いてください。' :
                     '日本語版と英語版を両方書いてください。日本語→英語の順で、---で区切ってください。';
  const isThread = state.tone==='thread';

  const systemPrompt = `あなたは防災情報をXに発信する専門アカウントの担当者です。
提供された地震・気象情報をもとに、X（旧Twitter）用の投稿文を作成してください。

【スタイル指示】${tonePrompts[state.tone]}
【言語指示】${langPrompt}
【文字数制限】${isThread?'各投稿を140字以内に収めてください（英語は280字以内）。スレッドの場合は【1/3】【2/3】のような番号を付けてください。':'140字以内に収めてください（英語のみの場合は280字以内）。'}
【注意事項】
- 事実のみを記載し、憶測や誇張は避けること
- 公的機関（気象庁等）の情報に基づくことを示すこと
- 投稿文のみを出力してください（説明・コメント不要）
- スレッド形式以外は1つの投稿文のみ出力`;

  const userPrompt = `以下の情報をもとに投稿文を作成してください:\n\n${items.map(it=>`【${it.type}】${it.data}`).join('\n')}`;

  // UI更新
  const genBtn = document.getElementById('genBtn');
  const genIcon = document.getElementById('genBtnIcon');
  const genText = document.getElementById('genBtnText');
  genBtn.disabled=true;
  genIcon.className='spin'; genIcon.textContent='↻';
  genText.textContent='生成中...';
  setStatus('Claude AIが投稿文を生成中...','loading');

  const outputArea = document.getElementById('outputArea');
  outputArea.innerHTML = '<span class="streaming-cursor"></span>';
  document.getElementById('outputTabs').style.display='none';

  let fullText = '';
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-beta':'messages-2023-12-15',
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        stream:true,
        system: systemPrompt,
        messages:[{role:'user',content:userPrompt}],
      }),
    });

    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err?.error?.message||'API Error '+resp.status);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      const chunk = decoder.decode(value);
      for(const line of chunk.split('\n')){
        if(!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if(data==='[DONE]') break;
        try{
          const parsed = JSON.parse(data);
          if(parsed.type==='content_block_delta' && parsed.delta?.text){
            fullText += parsed.delta.text;
            outputArea.innerHTML = escapeHtml(fullText) + '<span class="streaming-cursor"></span>';
            outputArea.scrollTop = outputArea.scrollHeight;
          }
        }catch(e){}
      }
    }

    // スレッド分割
    if(isThread){
      state.outputs = fullText.split(/\n{2,}/).filter(s=>s.trim());
    } else {
      state.outputs = [fullText];
    }
    state.currentTab = 0;
    renderOutputTabs();
    showOutput(0);
    setStatus('投稿文の生成が完了しました ✓');
  }catch(e){
    outputArea.innerHTML = `<span style="color:var(--accent);">エラー: ${escapeHtml(e.message)}</span>`;
    setStatus('生成エラー: '+e.message,'error');
  }

  genBtn.disabled=false;
  genIcon.className=''; genIcon.textContent='✦';
  genText.textContent='Claude AIで投稿文を生成';
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// OUTPUT TABS
// ============================================================
function renderOutputTabs(){
  const tabs = document.getElementById('outputTabs');
  if(state.outputs.length<=1){ tabs.style.display='none'; return; }
  tabs.style.display='flex';
  tabs.innerHTML = state.outputs.map((t,i)=>
    `<button class="out-tab${i===0?' active':''}" data-idx="${i}" onclick="switchTab(this)">投稿${i+1}</button>`
  ).join('');
}
function switchTab(btn){
  document.querySelectorAll('.out-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.currentTab = parseInt(btn.dataset.idx);
  showOutput(state.currentTab);
}
function showOutput(idx){
  const text = state.outputs[idx]||'';
  document.getElementById('outputArea').textContent = text;
  updateCharCount(text);
}
function updateCharCount(text){
  const len = text.length;
  const el = document.getElementById('charCount');
  el.textContent = len + ' 文字';
  el.className = 'char-count' + (len>140?' over':'');
}

// ============================================================
// COPY / X SHARE
// ============================================================
function copyText(){
  const text = state.outputs[state.currentTab]||'';
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById('copyBtn');
    btn.textContent='✓ コピー済み'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='📋 コピー'; btn.classList.remove('copied'); },2000);
  });
}
function openX(e){
  e.preventDefault();
  const text = state.outputs[state.currentTab]||'';
  if(!text){ setStatus('投稿文がありません','error'); return; }
  const url = 'https://twitter.com/intent/tweet?text='+encodeURIComponent(text);
  window.open(url,'_blank');
}
</script>
